name: Regulatory Intelligence Agents

on:
  schedule:
    # Esecuzione mensile: primo giorno del mese alle 08:00 UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent da eseguire'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - regulatory
          - analyzer
          - github

permissions:
  contents: write
  issues: write

jobs:
  regulatory-scan:
    name: Regulatory Scan & Gap Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Regulatory Agent
        if: ${{ github.event.inputs.agent == 'all' || github.event.inputs.agent == 'regulatory' || github.event_name == 'schedule' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Leggi le istruzioni in .claude/agents/regulatory_agent.md ed eseguile completamente. Aggiorna tutti i file di contesto in .claude/context/ con le ultime novita' normative sugli affitti brevi in Italia." --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep"

      - name: Run Analyzer Agent
        if: ${{ github.event.inputs.agent == 'all' || github.event.inputs.agent == 'analyzer' || github.event_name == 'schedule' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Leggi le istruzioni in .claude/agents/analyzer_agent.md ed eseguile completamente. Analizza i gap tra la normativa in .claude/context/regulations/ e la codebase corrente. Produci un report dettagliato." --allowedTools "Read,Write,Edit,Glob,Grep"

      - name: Run GitHub Agent
        if: ${{ github.event.inputs.agent == 'all' || github.event.inputs.agent == 'github' || github.event_name == 'schedule' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p "Leggi le istruzioni in .claude/agents/github_agent.md ed eseguile completamente. Crea issue GitHub per i gap identificati nel report dell'analyzer agent. Non creare issue duplicate." --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Commit context updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/context/ || true
          if git diff --staged --quiet; then
            echo "No context changes to commit"
          else
            git commit -m "chore: update regulatory context [automated]"
            git push
          fi
