name: Quality nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  remind-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: P0 fail freeze check (hard fail)
        shell: bash
        run: |
          MATRIX="Sessions/quality/ac-matrix-mvp.md"
          if [ ! -f "$MATRIX" ]; then
            echo "::error::Missing $MATRIX"
            exit 1
          fi
          if grep -E '\| `fail` \|' "$MATRIX" >/tmp/p0-fail-rows.txt; then
            echo "::error::P0 fail rows present — release freeze active per Sessions/quality/freeze-policy.md"
            cat /tmp/p0-fail-rows.txt
            exit 1
          fi
          echo "No matrix fail rows. Update Sessions/quality/nightly-$(date -u +%Y-%m-%d).md after full L2/L3 runs."

  spec-coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract-requirements
        shell: pwsh
        run: .\scripts\quality\extract-requirements.ps1
      - name: check-spec-coverage
        shell: pwsh
        run: .\scripts\quality\check-spec-coverage.ps1

  anti-stub:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-no-shipped-stubs
        shell: pwsh
        run: .\scripts\quality\check-no-shipped-stubs.ps1
