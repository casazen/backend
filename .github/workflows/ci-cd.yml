name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --verbosity normal \
            --filter "FullyQualifiedName!~PropertiesControllerIntegrationTests&FullyQualifiedName!~ApiTests&FullyQualifiedName!~UsersControllerIntegrationTests"

      - name: Check formatting
        run: dotnet format --verify-no-changes

  # Railway deploys via GitHub integration (push to develop → test environment).
  # This job only verifies health after the native deploy finishes.
  verify-test:
    name: Verify Railway Test (native deploy)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: test
      url: ${{ vars.RAILWAY_TEST_URL }}

    steps:
      - name: Wait for Railway native deployment
        run: |
          echo "Waiting 90s for Railway GitHub integration to deploy develop → test..."
          sleep 90

      - name: Health check
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          if [ -z "$RAILWAY_TEST_URL" ]; then
            echo "::warning::RAILWAY_TEST_URL not set — skipping health check."
            echo "Set GitHub variable RAILWAY_TEST_URL to your Railway test public URL (see docs/INFRA.md)."
            exit 0
          fi
          curl -f "${RAILWAY_TEST_URL}/api/health" \
            --retry 8 --retry-delay 15 --retry-connrefused --max-time 30
          echo "✅ Test environment healthy"

      - name: Smoke test (auth gate — expect 401, never 500)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          if [ -z "$RAILWAY_TEST_URL" ]; then exit 0; fi
          STATUS=$(curl -o /dev/null -sw "%{http_code}" \
            "${RAILWAY_TEST_URL}/api/properties")
          if [ "$STATUS" = "500" ]; then
            echo "❌ /api/properties returned 500 — likely pending EF migration (AddContextAuthorization)"
            exit 1
          fi
          if [ "$STATUS" != "401" ]; then
            echo "❌ Expected 401 on /api/properties, got $STATUS"
            exit 1
          fi
          echo "✅ Auth gate OK"

      - name: Smoke test (bookings — never 500 without auth)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          if [ -z "$RAILWAY_TEST_URL" ]; then exit 0; fi
          STATUS=$(curl -o /dev/null -sw "%{http_code}" \
            "${RAILWAY_TEST_URL}/api/bookings")
          if [ "$STATUS" = "500" ]; then
            echo "❌ /api/bookings returned 500 — likely pending EF migration"
            exit 1
          fi
          if [ "$STATUS" != "401" ]; then
            echo "❌ Expected 401 on /api/bookings, got $STATUS"
            exit 1
          fi
          echo "✅ Bookings auth gate OK"

      - name: Smoke test (users/me, contexts — never 500 without auth)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          if [ -z "$RAILWAY_TEST_URL" ]; then exit 0; fi
          for PATH_SUFFIX in users/me me/contexts users; do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              "${RAILWAY_TEST_URL}/api/${PATH_SUFFIX}")
            if [ "$STATUS" = "500" ]; then
              echo "❌ /api/${PATH_SUFFIX} returned 500 — run scripts/migrate.ps1 -Target test"
              exit 1
            fi
            if [ "$STATUS" != "401" ]; then
              echo "❌ Expected 401 on /api/${PATH_SUFFIX}, got $STATUS"
              exit 1
            fi
            echo "✅ /api/${PATH_SUFFIX} auth gate OK"
          done

      - name: Verify pricing adapter endpoint (auth gate — never 500)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
          TEST_PROPERTY_ID: ${{ vars.TEST_PROPERTY_ID }}
        run: |
          if [ -z "$RAILWAY_TEST_URL" ]; then exit 0; fi
          PROPERTY_ID="${TEST_PROPERTY_ID:-00000000-0000-0000-0000-000000000001}"
          STATUS=$(curl -o /dev/null -sw "%{http_code}" \
            "${RAILWAY_TEST_URL}/api/pricing-adapter/config/${PROPERTY_ID}")
          if [ "$STATUS" = "500" ]; then
            echo "❌ /api/pricing-adapter/config returned 500"
            exit 1
          fi
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "404" ] && [ "$STATUS" != "200" ]; then
            echo "❌ Unexpected status on pricing-adapter config: $STATUS"
            exit 1
          fi
          echo "✅ Pricing adapter auth gate OK (status $STATUS)"

  # Railway deploys production via GitHub integration (push to main → production environment).
  verify-prod:
    name: Verify Railway Production (native deploy)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.RAILWAY_PROD_URL }}

    steps:
      - name: Wait for Railway native deployment
        run: |
          echo "Waiting 120s for Railway GitHub integration to deploy main → production..."
          sleep 120

      - name: Production health check
        env:
          RAILWAY_PROD_URL: ${{ vars.RAILWAY_PROD_URL }}
        run: |
          if [ -z "$RAILWAY_PROD_URL" ]; then
            echo "::warning::RAILWAY_PROD_URL not set — skipping health check."
            exit 0
          fi
          curl -f "${RAILWAY_PROD_URL}/api/health" \
            --retry 8 --retry-delay 15 --retry-connrefused
          echo "✅ Production healthy"

      - name: Smoke test production (auth gate)
        env:
          RAILWAY_PROD_URL: ${{ vars.RAILWAY_PROD_URL }}
        run: |
          if [ -z "$RAILWAY_PROD_URL" ]; then exit 0; fi
          for PATH_SUFFIX in properties bookings users/me me/contexts; do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              "${RAILWAY_PROD_URL}/api/${PATH_SUFFIX}")
            if [ "$STATUS" = "500" ]; then
              echo "❌ /api/${PATH_SUFFIX} returned 500 — run scripts/migrate.ps1 -Target prod"
              exit 1
            fi
            if [ "$STATUS" != "401" ]; then
              echo "❌ Expected 401 on /api/${PATH_SUFFIX}, got $STATUS"
              exit 1
            fi
            echo "✅ Production /api/${PATH_SUFFIX} auth gate OK"
          done
