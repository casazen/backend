name: CI/CD Pipeline

# Backend gates: NuGet vulnerability gate, build, tests on PostgreSQL, format.
# Deploy verification after a green push is verify-railway-deploy.yml (not this suite).
# The former `echo`-only e2e-golden-journey.yml was removed (FD-02, A9-24); the real end-to-end gate (UI, ephemeral stack)
# is now e2e-golden-journey.yml (FN-03, docs/runbooks/golden-journey-l3.md). Runbook: docs/runbooks/ci-backend.md.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# A new push to a PR cancels the run of the commit it replaces. Pushes to develop/main get a group of their own (the
# run id), so none is ever cancelled or left pending: Railway Wait for CI and verify-railway-deploy.yml need each result.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Integration tests run on real PostgreSQL (FD-04): each WebApplicationFactory creates its own
    # it_<guid> database on this service, a copy of a template migrated once per run, and drops it afterwards.
    # Throw-away service container: the password below is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Include Error Detail=true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet audit (FD-02, A9-26): Directory.Build.props turns NU1903 (High) and NU1904 (Critical) into errors,
      # so restore fails on a vulnerable package, direct or transitive.
      - name: Restore dependencies
        run: dotnet restore

      # Explicit gate + full report. Runs even when restore failed on NU1903/NU1904: NuGet still writes
      # project.assets.json, so the report lists every vulnerable package. Runbook: docs/runbooks/ci-backend.md.
      - name: Vulnerable packages (fails on High/Critical, including transitive)
        if: ${{ !cancelled() }}
        run: bash scripts/check-vulnerable-packages.sh Casazen.sln

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install local document OCR tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng poppler-utils

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --verbosity minimal --maxcpucount

  # Its own job, in parallel with Build & Test: it needs neither the build nor PostgreSQL.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

  # Deploy verification (FD-12) lives in verify-railway-deploy.yml and starts after this
  # workflow succeeds. It must not share this check suite: Railway Wait for CI waits for
  # CI/CD Pipeline, and verify waits for the native deploy of the same SHA.