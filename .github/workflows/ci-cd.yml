name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Integration tests run on real PostgreSQL (FD-04): each WebApplicationFactory creates its own
    # it_<guid> database on this service, applies every EF migration and drops it afterwards.
    # Throw-away service container: the password below is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Include Error Detail=true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --verbosity normal --maxcpucount

      - name: Check formatting
        run: dotnet format --verify-no-changes

  # Railway deploys via GitHub integration (push to develop → test environment).
  # This job waits until the test API runs THIS commit and is ready (FD-12): /api/health/ready exposes the
  # commit Railway deployed (RAILWAY_GIT_COMMIT_SHA). It fails when RAILWAY_TEST_URL is not configured.
  # Railway's "Wait for CI" must stay off: it would wait for this job, which waits for the deploy.
  verify-test:
    name: Verify Railway Test (native deploy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: test
      url: ${{ vars.RAILWAY_TEST_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for this commit to be deployed and ready
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: bash scripts/verify-deploy.sh "$RAILWAY_TEST_URL" "${{ github.sha }}" 1200

      - name: Smoke test (auth gate — expect 401, never 500)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          STATUS=$(curl -o /dev/null -sw "%{http_code}" \
            "${RAILWAY_TEST_URL}/api/properties")
          if [ "$STATUS" = "500" ]; then
            echo "❌ /api/properties returned 500 — likely pending EF migration (AddContextAuthorization)"
            exit 1
          fi
          if [ "$STATUS" != "401" ]; then
            echo "❌ Expected 401 on /api/properties, got $STATUS"
            exit 1
          fi
          echo "✅ Auth gate OK"

      - name: Smoke test (bookings — never 500 without auth)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          STATUS=$(curl -o /dev/null -sw "%{http_code}" \
            "${RAILWAY_TEST_URL}/api/bookings")
          if [ "$STATUS" = "500" ]; then
            echo "❌ /api/bookings returned 500 — likely pending EF migration"
            exit 1
          fi
          if [ "$STATUS" != "401" ]; then
            echo "❌ Expected 401 on /api/bookings, got $STATUS"
            exit 1
          fi
          echo "✅ Bookings auth gate OK"

      - name: Smoke test (users/me, contexts — never 500 without auth)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
        run: |
          for PATH_SUFFIX in users/me me/contexts users; do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              "${RAILWAY_TEST_URL}/api/${PATH_SUFFIX}")
            if [ "$STATUS" = "500" ]; then
              echo "❌ /api/${PATH_SUFFIX} returned 500 — run scripts/migrate.ps1 -Target test"
              exit 1
            fi
            if [ "$STATUS" != "401" ]; then
              echo "❌ Expected 401 on /api/${PATH_SUFFIX}, got $STATUS"
              exit 1
            fi
            echo "✅ /api/${PATH_SUFFIX} auth gate OK"
          done

      - name: Verify pricing adapter endpoint (auth gate — never 500)
        env:
          RAILWAY_TEST_URL: ${{ vars.RAILWAY_TEST_URL }}
          TEST_PROPERTY_ID: ${{ vars.TEST_PROPERTY_ID }}
        run: |
          PROPERTY_ID="${TEST_PROPERTY_ID:-00000000-0000-0000-0000-000000000001}"
          STATUS=$(curl -o /dev/null -sw "%{http_code}" \
            "${RAILWAY_TEST_URL}/api/pricing-adapter/config/${PROPERTY_ID}")
          if [ "$STATUS" = "500" ]; then
            echo "❌ /api/pricing-adapter/config returned 500"
            exit 1
          fi
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "404" ] && [ "$STATUS" != "200" ]; then
            echo "❌ Unexpected status on pricing-adapter config: $STATUS"
            exit 1
          fi
          echo "✅ Pricing adapter auth gate OK (status $STATUS)"

  # Railway deploys production via GitHub integration (push to main → production environment).
  # Same verification as verify-test (FD-12): this commit deployed and /api/health/ready answering 200.
  verify-prod:
    name: Verify Railway Production (native deploy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.RAILWAY_PROD_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for this commit to be deployed and ready
        env:
          RAILWAY_PROD_URL: ${{ vars.RAILWAY_PROD_URL }}
        run: bash scripts/verify-deploy.sh "$RAILWAY_PROD_URL" "${{ github.sha }}" 1200

      - name: Smoke test production (auth gate)
        env:
          RAILWAY_PROD_URL: ${{ vars.RAILWAY_PROD_URL }}
        run: |
          for PATH_SUFFIX in properties bookings users/me me/contexts orgs/me/entitlement; do
            STATUS=$(curl -o /dev/null -sw "%{http_code}" \
              "${RAILWAY_PROD_URL}/api/${PATH_SUFFIX}")
            if [ "$STATUS" = "500" ]; then
              echo "❌ /api/${PATH_SUFFIX} returned 500 — run scripts/migrate.ps1 -Target prod"
              exit 1
            fi
            if [ "$STATUS" != "401" ]; then
              echo "❌ Expected 401 on /api/${PATH_SUFFIX}, got $STATUS"
              exit 1
            fi
            echo "✅ Production /api/${PATH_SUFFIX} auth gate OK"
          done

      - name: Production FE bundle sanity (must serve SPA, not placeholder)
        run: |
          BODY=$(curl -sf "https://casazen-app.vercel.app" || true)
          if [ -z "$BODY" ]; then
            echo "❌ Production FE unreachable at https://casazen-app.vercel.app"
            exit 1
          fi
          if ! echo "$BODY" | grep -q 'id="root"'; then
            echo "❌ Production FE missing React root — check Vercel Production deploy"
            exit 1
          fi
          echo "✅ Production FE SPA shell OK (casazen-app.vercel.app)"
