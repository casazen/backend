name: Step Pipeline Transitions

on:
  issues:
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

jobs:

  # Job 1: label raw-requirement → /step1-refine N (clarifier, haiku)
  trigger-step1-clarification:
    name: "Step 1 — Clarification"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'raw-requirement'

    steps:
      - uses: actions/checkout@v4

      - name: Get issue number
        id: issue
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Run Step 1 — Clarifier
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Qwen does not support Anthropic prompt caching; enable LiteLLM-level caching
          # on the proxy side (cache: {type: redis, ttl: 300}) to avoid re-billing the
          # same system-prompt tokens across repeated runs of the same step.
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model qwen-3.5-122b-sovereign \
            --allowedTools "Bash,Read,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "/step1-refine ${{ steps.issue.outputs.number }}" 2>&1

  # Job 2: issue_comment on awaiting-clarification issue, non-bot author → /step1-refine N mode=read-answers (haiku)
  handle-clarification-reply:
    name: "Step 1 — Process PO Reply"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'awaiting-clarification')

    steps:
      - uses: actions/checkout@v4

      - name: Get issue number
        id: issue
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Run Step 1 — Read Answers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model qwen-3.5-122b-sovereign \
            --allowedTools "Bash,Read,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "/step1-refine ${{ steps.issue.outputs.number }} mode=read-answers" 2>&1

  # Job 3: label council-ready → /step1-refine N mode=council (AGENT_TEAMS)
  trigger-council:
    name: "Step 1 — Council Review"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'council-ready'

    steps:
      - uses: actions/checkout@v4

      - name: Get issue number
        id: issue
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Run Step 1 — Council
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model qwen-3.5-122b-sovereign \
            --allowedTools "Bash,Read,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "/step1-refine ${{ steps.issue.outputs.number }} mode=council" 2>&1

  # Job 4: label approved → /step2-dispatch N (AGENT_TEAMS)
  trigger-step2:
    name: "Step 2 — Task Dispatcher"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved'

    steps:
      - uses: actions/checkout@v4

      - name: Get issue number
        id: issue
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Run Step 2 — Dispatcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model qwen-3.5-122b-sovereign \
            --allowedTools "Bash,Read,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "/step2-dispatch ${{ steps.issue.outputs.number }}" 2>&1

  # Job 5: label in-sprint → /step3-implement N (AGENT_TEAMS)
  trigger-step3:
    name: "Step 3 — Implementation"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'in-sprint'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Get issue number
        id: issue
        run: echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Run Step 3 — Implement
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Claude Haiku supports Anthropic prompt caching (cache_control: ephemeral).
          # Claude Code sends cache_control automatically for system prompts > 1024 tokens.
          # Ensure the proxy forwards the Anthropic-specific headers without stripping them.
          CLAUDE_CODE_ENABLE_PROMPT_CACHING: "1"
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model claude-haiku-4-5-20251001 \
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "/step3-implement ${{ steps.issue.outputs.number }}" 2>&1

  # Job 6: PR merged → Phase E (close task + Epic check)
  trigger-step3-post-merge:
    name: "Step 3 — Post-Merge (Phase E)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Extract task number from PR body
        id: task
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TASK_NUM=$(echo "$PR_BODY" | grep -oP '(?i)(?<=Closes #)\d+' | head -1)
          echo "number=${TASK_NUM}" >> $GITHUB_OUTPUT

      - name: Run Phase E — Task closure + Epic check
        if: steps.task.outputs.number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_ENABLE_PROMPT_CACHING: "1"
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model claude-haiku-4-5-20251001 \
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "Phase E post-merge for task #${{ steps.task.outputs.number }} (PR #${{ github.event.pull_request.number }} merged to main). Follow Phase E in .claude/workflows/step3-implementation.md exactly: (1) add label 'merged' to the task issue, (2) close the task issue with a comment referencing PR #${{ github.event.pull_request.number }}, (3) find the Epic from the task body ('Part of: casazen/backend#N'), (4) check if ALL task issues of that Epic are closed, (5) if all are closed: close the Epic with a delivery summary and commit an update to .claude/context/codebase_map.md directly to main." 2>&1

  # Job 7: issue closed → auto-unblock dependent in-sprint tasks
  trigger-unblock-on-close:
    name: "Auto-Unblock — Start dependent tasks"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'closed' &&
      github.event.issue.state_reason == 'completed'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Run auto-unblock check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SOVEREIGN_API_KEY }}
          ANTHROPIC_BASE_URL: https://adesso-ai-hub.3asabc.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
          CLAUDE_CODE_ENABLE_PROMPT_CACHING: "1"
        run: |
          npx @anthropic-ai/claude-code@latest \
            --model claude-haiku-4-5-20251001 \
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob" \
            --verbose \
            --dangerously-skip-permissions \
            -p "Issue #${{ github.event.issue.number }} was just closed as completed. Search for all open issues that have label 'in-sprint' AND reference 'Blocked by: casazen/backend#${{ github.event.issue.number }}' in their body. For each such issue: (1) check ALL 'Blocked by:' lines in the body — if every referenced dependency is now closed, run /step3-implement <issue_number> to start its implementation; (2) if some dependencies are still open, post a comment on the task listing which ones remain open." 2>&1
