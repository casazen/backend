name: Daily Testing & Review Orchestrator

on:
  schedule:
    # Runs every day at 5:00 PM UTC (6:00 PM CET, 7:00 PM CEST)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  code-review:
    name: Code Review with Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      review_result: ${{ steps.review.outputs.result }}
      review_summary: ${{ steps.review.outputs.summary }}
      quality_score: ${{ steps.review.outputs.quality_score }}
      has_critical_issues: ${{ steps.review.outputs.has_critical_issues }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (for Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check for Today's Changes
        id: check-changes
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COMMITS=$(git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" --oneline)
          COMMIT_COUNT=$(echo "$COMMITS" | wc -l)

          if [ $COMMIT_COUNT -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Code Reviewer Agent - Deep Review
        id: review
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "👀 Code Reviewer Agent: Performing comprehensive code review..."

          # Run dotnet restore and build first
          dotnet restore
          dotnet build --configuration Release --no-restore

          # Use code_reviewer agent for comprehensive review (Sonnet for deep analysis)
          REVIEW_OUTPUT=$(claude --model sonnet -p "$(cat <<'PROMPT_EOF'
          You are the code_reviewer agent for CasaZen. Review all commits made today using 'git log --since="today 00:00:00" --until="today 23:59:59" --patch'.

          **Review Criteria**:
          1. **Code Quality**: Adherence to C# conventions, SOLID principles, clean code
          2. **Security**: SQL injection, XSS, auth bypasses, secrets exposure, input validation
          3. **Async/Await**: Proper usage, no .Result/.Wait(), correct cancellation tokens
          4. **Testing**: Test coverage for new code, TDD followed, test quality
          5. **CLAUDE.md Compliance**: Follows project guidelines and guardrails
          6. **GitHub Flow**: Proper branch naming, commit messages (Conventional Commits)

          **Output Format** (write to stdout, parse with grep):
          - QUALITY_SCORE: [A|B|C|D|F]
          - CRITICAL_ISSUES: [YES|NO]
          - SUMMARY: One-line summary

          Provide detailed findings with file references (file:line), categorized by severity (CRITICAL, HIGH, MEDIUM, LOW). Do NOT save to files.
          PROMPT_EOF
          )" --allowedTools "Bash,Read,Glob,Grep" 2>&1)

          echo "$REVIEW_OUTPUT"

          # Parse output
          QUALITY_SCORE=$(echo "$REVIEW_OUTPUT" | grep -oP 'QUALITY_SCORE:\s*\K[A-F]' | head -1 || echo "C")
          CRITICAL_ISSUES=$(echo "$REVIEW_OUTPUT" | grep -oP 'CRITICAL_ISSUES:\s*\K(YES|NO)' | head -1 || echo "NO")
          SUMMARY=$(echo "$REVIEW_OUTPUT" | grep -oP 'SUMMARY:\s*\K.*' | head -1 || echo "Code review completed")

          echo "quality_score=$QUALITY_SCORE" >> $GITHUB_OUTPUT
          echo "has_critical_issues=$CRITICAL_ISSUES" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

          # Determine result
          if [ "$CRITICAL_ISSUES" == "YES" ]; then
            echo "result=critical" >> $GITHUB_OUTPUT
          elif [ "$QUALITY_SCORE" == "A" ] || [ "$QUALITY_SCORE" == "B" ]; then
            echo "result=approved" >> $GITHUB_OUTPUT
          elif [ "$QUALITY_SCORE" == "C" ]; then
            echo "result=approved_with_comments" >> $GITHUB_OUTPUT
          else
            echo "result=changes_requested" >> $GITHUB_OUTPUT
          fi

      - name: No Changes to Review
        if: steps.check-changes.outputs.has_changes == 'false'
        run: |
          echo "result=skipped" >> $GITHUB_OUTPUT
          echo "summary=No changes to review today ⏭️" >> $GITHUB_OUTPUT
          echo "quality_score=N/A" >> $GITHUB_OUTPUT
          echo "has_critical_issues=NO" >> $GITHUB_OUTPUT

  release-management:
    name: Release Management with Agent
    needs: code-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_result: ${{ steps.release.outputs.result }}
      release_summary: ${{ steps.release.outputs.summary }}
      pr_merged: ${{ steps.release.outputs.pr_merged }}
      deployment_env: ${{ steps.release.outputs.deployment_env }}
      deployment_decision: ${{ steps.release.outputs.deployment_decision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check Open PRs
        id: check-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get open PRs (GitHub Flow: feature branches → PR → main)
          PRS=$(gh pr list --state open --base main --json number,title,headRefName)
          PR_COUNT=$(echo "$PRS" | jq '. | length')

          echo "pr_count=$PR_COUNT" >> $GITHUB_OUTPUT

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "has_prs=false" >> $GITHUB_OUTPUT
            echo "⚠️ No open PRs found"
          else
            echo "has_prs=true" >> $GITHUB_OUTPUT
            echo "✅ Found $PR_COUNT open PRs targeting main branch"
          fi

      - name: Release Manager Agent - Merge & Deployment Decision
        id: release
        if: steps.check-prs.outputs.has_prs == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_REVIEW_RESULT: ${{ needs.code-review.outputs.review_result }}
          QUALITY_SCORE: ${{ needs.code-review.outputs.quality_score }}
          HAS_CRITICAL_ISSUES: ${{ needs.code-review.outputs.has_critical_issues }}
        run: |
          echo "🚀 Release Manager Agent: Reviewing PRs and making release decisions..."
          echo "Code Review Result: $CODE_REVIEW_RESULT"
          echo "Quality Score: $QUALITY_SCORE"
          echo "Critical Issues: $HAS_CRITICAL_ISSUES"

          # Use release_manager agent to decide on merging and deployment (Sonnet for critical decisions)
          RELEASE_OUTPUT=$(claude --model sonnet -p "$(cat <<'PROMPT_EOF'
          You are the release_manager agent for CasaZen following **GitHub Flow**:
          - Feature branches → PR to main → Review → Merge to main → Deploy from main

          **Context**:
          - Code Review Result: ${CODE_REVIEW_RESULT}
          - Quality Score: ${QUALITY_SCORE}
          - Has Critical Issues: ${HAS_CRITICAL_ISSUES}

          **Your Tasks**:
          1. **Review Open PRs**: Use 'gh pr list --state open --base main' and 'gh pr view <number>' for details
          2. **Check CI/CD Status**: Use 'gh pr checks <number>' to verify all checks passed
          3. **Review Code Quality**: Read the code review results from previous step
          4. **Make Merge Decision**:
             - If code review is 'approved' (A/B score) AND all CI checks pass AND no critical issues → MERGE to main
             - If code review is 'approved_with_comments' (C score) AND all CI checks pass AND no critical issues → MERGE to main with monitoring
             - If code review is 'changes_requested' (D/F score) OR critical issues exist → DO NOT MERGE, request changes
          5. **Decide Deployment Environment**:
             - Quality A + no issues → production
             - Quality B + no issues → staging (with plan for production)
             - Quality C + no issues → development
             - Any critical issues → DO NOT DEPLOY

          **Actions**:
          - Merge approved PRs: 'gh pr merge <number> --squash --delete-branch'
          - Request changes: 'gh pr review <number> --request-changes --body "<feedback>"'
          - Add PR comments with deployment recommendations

          **Output Format** (write to stdout for parsing):
          - PR_MERGED: [number of PRs merged, e.g., 2]
          - DEPLOYMENT_ENV: [production|staging|development|none]
          - DEPLOYMENT_DECISION: [deploy|hold|block]
          - SUMMARY: One-line summary

          Provide detailed rationale for each decision. Do NOT save to files.
          PROMPT_EOF
          )" --allowedTools "Bash,Read,Glob,Grep" 2>&1)

          echo "$RELEASE_OUTPUT"

          # Parse output
          PR_MERGED=$(echo "$RELEASE_OUTPUT" | grep -oP 'PR_MERGED:\s*\K\d+' | head -1 || echo "0")
          DEPLOYMENT_ENV=$(echo "$RELEASE_OUTPUT" | grep -oP 'DEPLOYMENT_ENV:\s*\K\w+' | head -1 || echo "none")
          DEPLOYMENT_DECISION=$(echo "$RELEASE_OUTPUT" | grep -oP 'DEPLOYMENT_DECISION:\s*\K\w+' | head -1 || echo "hold")
          SUMMARY=$(echo "$RELEASE_OUTPUT" | grep -oP 'SUMMARY:\s*\K.*' | head -1 || echo "Release management completed")

          echo "pr_merged=$PR_MERGED" >> $GITHUB_OUTPUT
          echo "deployment_env=$DEPLOYMENT_ENV" >> $GITHUB_OUTPUT
          echo "deployment_decision=$DEPLOYMENT_DECISION" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

          # Set result
          if [ "$PR_MERGED" -gt 0 ]; then
            echo "result=merged" >> $GITHUB_OUTPUT
          elif [ "$HAS_CRITICAL_ISSUES" == "YES" ]; then
            echo "result=blocked" >> $GITHUB_OUTPUT
          else
            echo "result=pending" >> $GITHUB_OUTPUT
          fi

      - name: No PRs to Manage
        if: steps.check-prs.outputs.has_prs == 'false'
        run: |
          echo "result=skipped" >> $GITHUB_OUTPUT
          echo "summary=No PRs to review ⏭️" >> $GITHUB_OUTPUT
          echo "pr_merged=0" >> $GITHUB_OUTPUT
          echo "deployment_env=none" >> $GITHUB_OUTPUT
          echo "deployment_decision=none" >> $GITHUB_OUTPUT

  send-email-report:
    name: Send Daily Report Email
    needs: [code-review, release-management]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Email Report
        id: email
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          REPORT_FILE="daily-report-$TODAY.html"

          cat > $REPORT_FILE <<'HTML_EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <style>
              body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
              h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
              h2 { color: #34495e; margin-top: 30px; border-left: 4px solid #3498db; padding-left: 10px; }
              .summary { background: #ecf0f1; padding: 15px; border-radius: 5px; margin: 20px 0; }
              .status { padding: 5px 10px; border-radius: 3px; font-weight: bold; }
              .success { background: #2ecc71; color: white; }
              .approved { background: #27ae60; color: white; }
              .failure { background: #e74c3c; color: white; }
              .critical { background: #c0392b; color: white; }
              .warning { background: #f39c12; color: white; }
              .info { background: #3498db; color: white; }
              .merged { background: #16a085; color: white; }
              .blocked { background: #e74c3c; color: white; }
              table { width: 100%; border-collapse: collapse; margin: 20px 0; }
              th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
              th { background: #34495e; color: white; }
              .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #7f8c8d; font-size: 0.9em; }
              .badge { display: inline-block; padding: 3px 8px; border-radius: 3px; font-size: 0.9em; margin-left: 5px; }
            </style>
          </head>
          <body>
            <h1>🏠 CasaZen - Daily Testing & Review Report</h1>
            <div class="summary">
              <strong>Date:</strong> ${TODAY}<br>
              <strong>Report Time:</strong> $(date -u +'%H:%M:%S UTC')<br>
              <strong>Repository:</strong> casazen/backend<br>
              <strong>Workflow:</strong> GitHub Flow (feature → PR → main → deploy)
            </div>

            <h2>📊 Executive Summary</h2>
            <table>
              <tr>
                <th>Component</th>
                <th>Status</th>
                <th>Details</th>
              </tr>
              <tr>
                <td>Code Review</td>
                <td><span class="status ${{ needs.code-review.outputs.review_result == 'approved' && 'approved' || needs.code-review.outputs.review_result == 'critical' && 'critical' || 'info' }}">${{ needs.code-review.outputs.review_result || 'N/A' }}</span></td>
                <td>${{ needs.code-review.outputs.review_summary || 'No review data' }}</td>
              </tr>
              <tr>
                <td>Release Management</td>
                <td><span class="status ${{ needs.release-management.outputs.release_result == 'merged' && 'merged' || needs.release-management.outputs.release_result == 'blocked' && 'blocked' || 'info' }}">${{ needs.release-management.outputs.release_result || 'N/A' }}</span></td>
                <td>${{ needs.release-management.outputs.release_summary || 'No release data' }}</td>
              </tr>
            </table>

            <h2>👀 Code Review (AI Agent)</h2>
            <p><strong>Status:</strong> <span class="status ${{ needs.code-review.outputs.review_result == 'approved' && 'approved' || needs.code-review.outputs.review_result == 'critical' && 'critical' || 'info' }}">${{ needs.code-review.outputs.review_result || 'N/A' }}</span></p>
            <p><strong>Summary:</strong> ${{ needs.code-review.outputs.review_summary || 'No changes reviewed' }}</p>
            <ul>
              <li>Quality Score: <strong>${{ needs.code-review.outputs.quality_score || 'N/A' }}</strong></li>
              <li>Critical Issues: <strong>${{ needs.code-review.outputs.has_critical_issues || 'N/A' }}</strong></li>
            </ul>
            <p><em>Comprehensive review covering: code quality, security, async/await, testing, compliance with CLAUDE.md</em></p>

            <h2>🚀 Release Management (AI Agent)</h2>
            <p><strong>Status:</strong> <span class="status ${{ needs.release-management.outputs.release_result == 'merged' && 'merged' || needs.release-management.outputs.release_result == 'blocked' && 'blocked' || 'info' }}">${{ needs.release-management.outputs.release_result || 'N/A' }}</span></p>
            <p><strong>Summary:</strong> ${{ needs.release-management.outputs.release_summary || 'No PRs managed' }}</p>
            <ul>
              <li>PRs Merged to Main: <strong>${{ needs.release-management.outputs.pr_merged || '0' }}</strong></li>
              <li>Deployment Environment: <strong style="text-transform: uppercase;">${{ needs.release-management.outputs.deployment_env || 'none' }}</strong></li>
              <li>Deployment Decision: <span class="badge ${{ needs.release-management.outputs.deployment_decision == 'deploy' && 'success' || needs.release-management.outputs.deployment_decision == 'block' && 'critical' || 'warning' }}">${{ needs.release-management.outputs.deployment_decision || 'N/A' }}</span></li>
            </ul>
            <p><em>GitHub Flow: PRs merged to main are ready for deployment based on quality assessment</em></p>

            <h2>📈 Next Steps & Recommendations</h2>
            <ul>
              <li>Review detailed AI agent analysis in GitHub Actions workflow logs</li>
              <li><strong>If critical issues found:</strong> Address immediately before next development cycle</li>
              <li><strong>If PRs merged to main:</strong> Monitor deployment to ${{ needs.release-management.outputs.deployment_env || 'target environment' }}</li>
              <li><strong>If deployment approved:</strong> Release manager has cleared for ${{ needs.release-management.outputs.deployment_env || 'environment' }} deployment</li>
              <li><strong>If deployment blocked:</strong> Fix issues identified by code reviewer before release</li>
              <li><strong>Next development cycle:</strong> Tomorrow at 08:00 UTC</li>
            </ul>

            <h2>🔄 GitHub Flow Status</h2>
            <p>This workflow follows <strong>GitHub Flow</strong>:</p>
            <ol>
              <li>✅ Feature branches created by daily development orchestrator</li>
              <li>✅ Pull requests opened to main branch</li>
              <li>🔍 Code review performed by AI agent (this step)</li>
              <li>🚀 Release manager decides on merge and deployment (this step)</li>
              <li>📦 Merged PRs on main are ready for deployment to approved environment</li>
            </ol>

            <div class="footer">
              <p>
                🤖 This report was automatically generated by the CasaZen Daily Testing & Review Orchestrator<br>
                🧠 Powered by Claude Code AI Agents (code_reviewer + release_manager)<br>
                📧 Questions? Check the workflow logs: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a><br>
                🏠🧘 CasaZen - Vacation rentals without stress!
              </p>
            </div>
          </body>
          </html>
          HTML_EOF

          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT

      - name: Send Email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          REPORT_FILE: ${{ steps.email.outputs.report_file }}
        run: |
          # Send email using SendGrid API
          curl -X POST https://api.sendgrid.com/v3/mail/send \
            -H "Authorization: Bearer $SENDGRID_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<'JSON_EOF'
          {
            "personalizations": [{
              "to": [{"email": "luca.lamal@hotmail.it", "name": "Luca La Malfa"}],
              "subject": "CasaZen Daily Report - $(date -u +%Y-%m-%d)"
            }],
            "from": {
              "email": "noreply@casazen.app",
              "name": "CasaZen Dev Bot"
            },
            "content": [{
              "type": "text/html",
              "value": $(cat $REPORT_FILE | jq -Rs .)
            }]
          }
          JSON_EOF

          if [ $? -eq 0 ]; then
            echo "✅ Email report sent successfully to luca.lamal@hotmail.it"
          else
            echo "❌ Failed to send email report"
            exit 1
          fi
