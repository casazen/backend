name: CI speed profile (temporary, work branch only)

# Throw-away measurement workflow for the CI speed-up work: per-test durations (TRX), CPU utilisation while the
# tests run and the build performance summary. Runs only on pushes to the work branch that touch this file.
# It is deleted before the speed-up PR is merged.

on:
  push:
    branches: [chore/ci-speed-backend]
    paths: ['.github/workflows/ci-speed-profile.yml']

jobs:
  profile:
    name: profile ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            runsettings: ''
          - variant: threads8
            runsettings: '-- xUnit.MaxParallelThreads=8'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Include Error Detail=true
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          nproc; free -m; df -h / | tail -n 1; grep -m1 'model name' /proc/cpuinfo
          docker version --format '{{.Server.Version}}' || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (performance summary)
        run: |
          dotnet build --configuration Release --no-restore -clp:PerformanceSummary > build-perf.log 2>&1 || (tail -n 60 build-perf.log; exit 1)
          grep -n -A 25 'Target Performance Summary' build-perf.log | head -n 60 || true
          grep -n -A 25 'Task Performance Summary' build-perf.log | head -n 40 || true
          du -sh Casazen.Tests/bin/Release/net10.0 Casazen.Web/bin/Release/net10.0 2>/dev/null || true

      - name: Install local document OCR tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng poppler-utils

      - name: Test (TRX + CPU sampling)
        run: |
          mkdir -p prof
          (vmstat -n 5 > prof/vmstat.log 2>&1 &)
          dotnet test --configuration Release --no-build --verbosity minimal --maxcpucount \
            --logger "trx;LogFileName=results.trx" --results-directory prof/TestResults ${{ matrix.runsettings }}

      - name: Upload profile data
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            prof/
            build-perf.log
