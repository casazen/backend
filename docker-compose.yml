version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: casazen-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Casazen2026!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - casazen-network

  api:
    build: .
    container_name: casazen-api
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=CasazenDb;User Id=sa;Password=Casazen2026!;TrustServerCertificate=true"
      Auth0__Domain: "your-domain.auth0.com"
      Stripe__SecretKey: "sk_test_YOUR_KEY"
      Email__SendGridApiKey: "SG.YOUR_KEY"
    ports:
      - "5001:5001"
    networks:
      - casazen-network

volumes:
  sqldata:

networks:
  casazen-network:
    driver: bridge
