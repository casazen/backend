  --terra-200:#ffe2d3;
  --terra-300:#f6b898;
  --terra-50:#fff7f2;
  --terra-600:#c2410c;
  --terra-800:#9a3412;
  --terra-900:#7c2d12;
  --page:var(--stone-25);--surface:var(--stone-0);--soft:var(--stone-50);
  --text:var(--ink-700);--muted:var(--ink-600);--line:var(--stone-200);
  --action:var(--terra-800);--action-bg:var(--terra-50);--inform:var(--blue-text);
  --control:44px;--panel:22px;--rail:216px;
  font-family:Inter,system-ui,sans-serif;font-size:16px;color:var(--text);background:var(--page);font-synthesis:none;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{line-height:1.5}
h1,h2,h3,h4,p,ul,ol{margin:0}
input,select,button{font:inherit;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue-solid);outline-offset:3px}
main:focus,.pane:focus{outline:none}
a,button,input,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.62}
.skip{position:fixed;inset:10px auto auto 10px;z-index:20;transform:translateY(-160%);padding:10px;background:white;border-radius:10px}
.skip:focus{transform:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.icon{display:inline-block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:19px;height:19px;flex:none;vertical-align:middle}
.icon.small{width:16px;height:16px}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.sidebar{
  position:sticky;align-self:start;top:0;height:100dvh;display:flex;flex-direction:column;
  padding:27px 16px 18px 19px;gap:25px;border-inline-end:1px solid var(--line);
  background:var(--soft)
}
.brand{display:inline-flex;align-items:center;gap:9px;width:max-content;max-width:100%;font-size:23px;line-height:1;text-decoration:none;letter-spacing:-.055em;font-weight:710}
.brand img{width:32px;height:32px}
.sidebar .brand{margin:1px 5px}
.org{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;line-height:1.3}
.org-mark{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink-100);color:var(--ink-600);font-size:12px;font-weight:750}
.org b,.org small{display:block}
.org b{font-size:13px}
.org small,.preview-note{font-size:12px;color:var(--muted)}
.nav{display:grid;gap:5px}
.nav a,.role-link{min-height:var(--control);display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:620}
.nav a[aria-current]{background:var(--terra-100);color:var(--action)}
.nav a:not([aria-current]):hover,.role-link:hover{background:var(--stone-100)}
.nav .icon,.role-link .icon{width:17px;height:17px}
.sidebar-bottom{margin-top:auto}
.preview-note{margin:8px 10px 0}
.mobile-nav,.mobile-brand,.mobile-only{display:none}
.main{min-width:0}
.container{width:min(100%,1440px);padding:0 clamp(20px,3.4vw,54px) 56px;margin-inline:auto}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  min-height:73px;border-bottom:1px solid var(--line);margin-bottom:27px
}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.breadcrumb b{font-weight:680;color:var(--text)}
.heading{margin-bottom:24px}
.heading h1{font-size:clamp(34px,4vw,54px);font-weight:725;letter-spacing:-.067em;line-height:1.06;text-wrap:balance}
.heading p{margin-top:10px;color:var(--muted);max-width:65ch}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:15px}
.toolbar .heading{margin-bottom:0}
.btn,.quiet,.help-btn,.back{
  min-height:var(--control);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:10px;font-size:14px;font-weight:660;text-decoration:none;line-height:1.24;
  white-space:normal;text-align:center
}
.btn{padding:10px 14px;border:1px solid var(--action);background:var(--action);color:white}
.btn:hover{background:var(--terra-900);border-color:var(--terra-900)}
.btn.secondary{background:var(--surface);border-color:var(--stone-500);color:var(--text)}
.btn.secondary:hover{background:var(--soft)}
.btn.ink{background:var(--ink-600);color:white;border-color:var(--ink-600)}
.btn.ink:hover{background:var(--ink-700)}
.btn.admin{background:var(--ametista-700);color:white;border-color:var(--ametista-700)}
.btn.admin:hover{background:var(--ametista-800)}
.quiet,.back{padding:7px 8px;color:var(--ink-600);background:transparent;border:0}
.quiet:hover,.back:hover{text-decoration:underline;text-underline-offset:3px}
.help-btn{flex:none;padding:9px 12px;color:var(--inform);background:var(--blue-bg);border:1px solid var(--blue-border)}
.help-btn:hover{background:var(--surface)}
.help-btn .icon{height:17px;width:17px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:7px;font-size:12px;font-weight:670;line-height:1.25;max-width:100%;vertical-align:middle}
.pill.green{color:var(--green-text);background:var(--green-bg)}
.pill.amber{color:var(--amber-text);background:var(--amber-bg)}
.pill.blue{color:var(--blue-text);background:var(--blue-bg)}
.pill.red{color:var(--red-text);background:var(--red-bg)}
.pill.gray{color:var(--stone-700);background:var(--stone-100)}
.pill .icon{width:14px;height:14px}
.roadmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0;list-style:none;gap:9px;margin-bottom:22px}
.roadmap a{
  text-decoration:none;display:grid;grid-template-columns:38px 1fr minmax(0,auto);
  gap:11px;align-items:center;min-height:70px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:15px
}
.roadmap a:hover,.roadmap a[aria-current]{border-color:var(--terra-300);background:var(--action-bg)}
.roadmap .symbol{color:var(--ink-600);background:var(--ink-100);display:grid;place-items:center;width:38px;height:38px;border-radius:12px}
.roadmap a[aria-current] .symbol{color:var(--action);background:var(--terra-100)}
.roadmap strong,.roadmap small{display:block;line-height:1.34}
.roadmap strong{font-size:14px}
.roadmap small{font-size:12px;margin-top:3px;color:var(--muted)}
.roadmap .count{font-size:19px;letter-spacing:-.04em;font-weight:720;font-variant-numeric:tabular-nums;color:var(--ink-600)}
.workspace{display:grid;grid-template-columns:minmax(260px,.88fr) minmax(0,1.4fr);gap:15px;align-items:start}
.queue,.pane,.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--panel)}
.queue{padding:14px}
.queue-heading{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 1px 12px}
h2{font-size:clamp(20px,2.2vw,25px);letter-spacing:-.046em;line-height:1.18;text-wrap:balance}
h3{font-size:17px;letter-spacing:-.028em;line-height:1.25;text-wrap:balance}
h4{font-size:14px}
.queue-tools{display:grid;grid-template-columns:minmax(0,1fr) 106px;gap:8px;margin-bottom:10px}
.field{display:grid;gap:5px;font-size:13px;font-weight:645;min-width:0}
.field input,.field select,.field textarea{
  min-height:var(--control);max-width:100%;width:100%;min-width:0;background:var(--surface);color:var(--text);
  border:1px solid var(--stone-500);border-radius:9px;padding:9px 10px;font-weight:450;font-size:14px
}
.field input::placeholder,.field textarea::placeholder{color:var(--stone-600);opacity:1}
.query{position:relative}
.query input{padding-left:33px}
.query .icon{position:absolute;left:10px;top:14px;pointer-events:none;color:var(--muted);width:16px;height:16px}
.queue-rows{display:grid;gap:4px}
.qrow{display:flex;align-items:stretch;min-width:0;border:1px solid transparent;border-radius:13px}
.qrow:hover{background:var(--soft)}
.qrow.current{background:var(--terra-50);border-color:var(--terra-200)}
.qrow a{flex:1;display:grid;grid-template-columns:40px minmax(0,1fr) 17px;align-items:center;gap:10px;padding:10px;text-decoration:none;min-height:72px;min-width:0}
.qrow .monogram,.property-mark{
  display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;
  background:var(--ink-100);color:var(--ink-600);font-size:12px;font-weight:720;letter-spacing:.02em
}
.qrow.current .monogram,.property-mark{background:var(--terra-100);color:var(--action)}
.qrow .qtitle{display:block;line-height:1.3;font-size:14px;font-weight:680;overflow-wrap:anywhere}
.qrow .qmeta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.25}
.qrow .qsignal{margin-top:5px}
.qrow .chev{color:var(--muted);justify-self:end}
.queue-foot{padding:10px 5px 1px;font-size:12px;color:var(--muted)}
.bulk-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--ink-100);border-radius:10px;margin:8px 0;padding:8px;font-size:13px}
.check-slot{display:grid;place-items:center;flex:none;width:var(--control);align-self:center;height:var(--control);cursor:pointer}
.check-slot input,.check input{width:19px;height:19px;accent-color:var(--action);cursor:pointer;flex:none}
.check{display:flex;align-items:center;gap:9px;min-height:44px;font-size:14px;cursor:pointer}
.qrow:has(.check-slot) a{padding-left:1px}
.pane{overflow:hidden}
.property-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;
  background:linear-gradient(110deg,var(--ink-100),var(--stone-25) 64%);padding:21px 20px 18px
}
.property-head h2{font-size:clamp(22px,2.35vw,33px);margin:0 0 4px}
.property-head .place{color:var(--muted);font-size:13px;display:flex;gap:5px;align-items:center}
.property-identity{display:flex;align-items:center;gap:11px;min-width:0}
.property-mark{background:var(--surface);border:1px solid var(--line);width:46px;height:46px}
.pane-body{padding:16px 19px 19px}
.next{
  border:1px solid var(--terra-200);background:var(--terra-50);padding:15px;
  border-radius:15px;display:grid;gap:7px;margin-bottom:17px
}
.next .next-label{font-size:12px;font-weight:720;color:var(--action);letter-spacing:.02em}
.next p,.muted{color:var(--muted)}
.next p,.compact{font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.next .actions{margin-top:3px}
.actions .help-btn{background:var(--surface)}
.actions .help-btn:hover{background:var(--blue-bg)}
.timeline{list-style:none;padding:0;margin-top:11px;display:grid}
.timeline>li{display:grid;grid-template-columns:27px minmax(0,1fr);gap:10px;min-height:49px;padding:8px 0;position:relative}
.timeline>li:not(:last-child)::after{content:"";position:absolute;left:13px;top:33px;bottom:-8px;width:1px;background:var(--line)}
.dot{position:relative;z-index:1;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--stone-100);color:var(--ink-600);font-size:12px;font-weight:700}
.dot.done{background:var(--green-bg);color:var(--green-text)}
.dot.now{background:var(--terra-100);color:var(--action)}
.dot .icon{width:15px;height:15px}
.timeline-title{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;margin:3px 0 2px}
.timeline-title strong{font-size:14px}
.timeline p{font-size:13px;color:var(--muted)}
.channels{display:grid;gap:4px;margin-top:6px}
.channel{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;background:var(--soft);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:590}
.pane-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.next-mobile{display:none}
.card{padding:18px}
.box{display:grid;gap:10px}
.card h2,.card h3{margin-bottom:1px}
.split,.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.split{grid-template-columns:minmax(0,1.4fr) minmax(235px,.7fr)}
.flow{display:grid;gap:14px}
.flow-label{font-size:13px;font-weight:700;color:var(--action);margin:3px 0 5px}
.flow-head{margin-bottom:18px}
.flow-head .heading{margin:7px 0 0}
.back{width:max-content;max-width:100%;padding-inline:0}
.flow .heading h1{font-size:clamp(30px,3.8vw,48px)}
.notice{display:flex;align-items:flex-start;gap:8px;padding:12px;background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:11px;font-size:14px;color:var(--blue-text)}
.notice.warning{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber-text)}
.notice.success{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.notice .icon{margin-top:2px}
.aside-info{background:var(--ink-100);border-color:var(--ink-100)}
.aside-help{background:var(--blue-bg);border-color:var(--blue-border)}
.aside-info .compact,.aside-help .compact{line-height:1.55}
.aside-help h2,.aside-help h3{color:var(--inform)}
.aside-help .help-btn{width:max-content;max-width:100%;background:white}
.source-box{background:var(--soft);padding:12px;border-radius:10px;font-size:13px;line-height:1.55}
.source-box>summary{cursor:pointer;min-height:var(--control);padding:10px 0;font-weight:650}
.source-box .value{font-weight:680}
.simple-list{list-style:none;padding:0;margin:0}
.simple-list>li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.simple-list>li:first-child{border-top:0}
.simple-list>li>div:first-child{min-width:0}
.simple-list strong,.simple-list small{display:block}
.simple-list small{color:var(--muted);font-size:13px;margin-top:3px}
.record-list{display:grid;gap:10px;padding:0;list-style:none}
.record{display:grid;gap:6px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.record .pill{justify-self:start}
.record-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.amount{font-size:28px;font-weight:740;letter-spacing:-.045em;line-height:1.1;font-variant-numeric:tabular-nums}
.principal{background:var(--terra-50);border-color:var(--terra-200)}
.inline-form{display:flex;align-items:end;gap:9px;flex-wrap:wrap}
.inline-form .field{flex:1 1 160px}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:690;padding:0 0 7px}
.option-group{display:flex;flex-wrap:wrap;gap:7px}
.option-group label,.click-card{display:flex;align-items:center;min-height:var(--control);gap:8px;cursor:pointer}
.option-group label{border:1px solid var(--stone-500);border-radius:10px;padding:8px 10px;font-size:14px}
.option-group label:has(:checked){background:var(--terra-50);border-color:var(--terra-800)}
.option-group input,.choice input{width:17px;height:17px;accent-color:var(--action);flex:none}
.choice{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;min-height:44px;font-size:14px;cursor:pointer}
.choice:has(:checked){background:var(--terra-50);border-color:var(--terra-300)}
.choice span{overflow-wrap:anywhere}
.portal-card{display:grid;gap:8px;height:100%;align-content:start}
.portal-card .btn{justify-self:start;margin-top:5px}
.portal-mark{
  display:grid;place-items:center;width:45px;height:45px;flex:none;border:1px solid var(--line);
  border-radius:13px;background:var(--surface);font-weight:730;font-size:14px;color:var(--ink-600)
}
.portal-mark img{width:27px;height:27px;object-fit:contain}
.group-title{display:flex;align-items:center;gap:9px}
.section-gap{margin-top:19px}
.flow-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.console .heading h1{color:var(--ametista-900)}
.console .aside-info{background:var(--ametista-50);border-color:var(--ametista-200)}
.status-strip{display:flex;flex-wrap:wrap;gap:7px}
.status-strip .pill{border:1px solid var(--line)}
details{color:var(--muted)}
summary{cursor:pointer;font-size:14px;font-weight:650;min-height:44px;padding:11px 0;color:var(--text)}
#help{
  margin:0 0 0 auto;position:fixed;inset:0 0 0 auto;width:min(100vw,454px);height:100dvh;max-height:100dvh;
  max-width:100vw;background:var(--page);border:0;border-left:1px solid var(--blue-border);
  box-shadow:0 0 36px color-mix(in srgb,var(--ink-700) 18%,transparent);padding:0;color:var(--text)
}
#help::backdrop{background:color-mix(in srgb,var(--ink-700) 38%,transparent)}
.dialog-inner{display:grid;gap:14px;padding:20px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dialog-head .group-title{color:var(--inform);font-size:14px;font-weight:710}
.dialog-inner .card{padding:14px}
.dialog-inner .source-box{margin-top:2px}
.status-banner{margin:0 0 13px}
.empty{padding:13px 9px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .btn,.nav a,.qrow,.roadmap a{transition:background-color .15s,border-color .15s}
}
@media (max-width:1150px){
  :root{--rail:179px}
  .sidebar{padding-inline:12px}
  .container{padding-inline:23px}
  .workspace{grid-template-columns:minmax(245px,.93fr) minmax(0,1.24fr)}
  .property-head,.pane-body{padding-inline:15px}
  .roadmap a{grid-template-columns:33px 1fr auto;gap:7px}
  .roadmap .symbol{width:33px;height:33px}
}
@media (max-width:955px){
  .shell{display:block}
  .sidebar{display:none}
  .mobile-nav{display:flex;gap:4px;overflow:auto;margin:0 -2px 16px;padding:2px}
  .mobile-nav a,.mobile-nav .role-link{white-space:nowrap}
  .mobile-brand{display:inline-flex}
  .topbar .breadcrumb{display:none}
  .topbar{margin-bottom:10px;min-height:65px}
  .container{padding-inline:21px}
  .workspace{grid-template-columns:minmax(230px,.85fr) minmax(0,1.34fr)}
}
@media (max-width:675px){
  .container{padding:0 14px 34px}
  .topbar{min-height:58px}
  .mobile-brand img{width:26px;height:26px}
  .mobile-brand{font-size:21px;gap:5px}
  .mobile-nav{margin-bottom:14px}
  .mobile-nav .icon{width:15px;height:15px}
  .mobile-nav a,.mobile-nav .role-link{gap:5px;padding:7px 8px;font-size:12px}
  .topbar .help-btn{font-size:12px;padding-inline:8px;gap:5px}
  .topbar .help-btn .icon{width:14px;height:14px}
  .heading{margin-bottom:17px}
  .heading h1{font-size:35px}
  .heading p{font-size:14px;margin-top:7px}
  .roadmap{gap:5px;margin-bottom:13px}
  .roadmap a{grid-template-columns:24px minmax(0,1fr);min-height:58px;padding:7px 5px;gap:4px;align-items:center}
  .roadmap .symbol{width:23px;height:23px;border-radius:7px}
  .roadmap .icon{width:14px;height:14px}
  .roadmap strong{font-size:11px;overflow-wrap:anywhere}
  .roadmap small{font-size:10px}
  .roadmap .count{display:none}
  .workspace{display:block}
  .workspace[data-detail="false"] .pane{display:none}
  .workspace[data-detail="true"] .queue{display:none}
  .workspace[data-detail="true"] .mobile-only{display:inline-flex;margin:0 0 5px}
  .workspace[data-detail="false"] .next-mobile{
    display:flex;align-items:center;justify-content:space-between;gap:7px;background:var(--terra-50);
    border:1px solid var(--terra-200);border-radius:13px;margin-bottom:11px;padding:9px 10px
  }
  .next-mobile span{font-size:12px;color:var(--action);font-weight:680}
  .next-mobile strong{display:block;font-size:14px;color:var(--text)}
  .next-mobile>a{white-space:nowrap}
  .queue{padding:10px}
  .pane-body,.property-head{padding-inline:11px}
  .next{padding:12px}
  .split,.tiles,.record-grid,.field-grid{grid-template-columns:1fr}
  .card{padding:13px}
  .flow .heading h1{font-size:34px}
  .mobile-hide{display:none}
  #help{border:0}
}
@media (max-width:365px){
  .container{padding-inline:10px}
  .roadmap a{grid-template-columns:1fr}
  .roadmap .symbol{display:none}
  .roadmap strong{font-size:12px}
  .queue-tools{grid-template-columns:minmax(0,1fr) 92px}
  .qrow a{grid-template-columns:32px minmax(0,1fr) 14px;gap:6px}

:root{
  --rail:256px;--sidebar-width:256px;--header-height:64px;--bottom-nav-height:64px;
  --panel:14px;--text:var(--ink-700);--muted:var(--stone-600);
  --accent:var(--terra-600);--accent-text:var(--terra-800);--accent-soft:var(--terra-100);
  --action:var(--accent);--action-bg:var(--terra-50)
}
html[data-area="admin"]{
  --accent:var(--ametista-600);--accent-text:var(--ametista-800);--accent-soft:var(--ametista-100);
  --action-bg:var(--ametista-50)
}
.shell{grid-template-columns:var(--sidebar-width) minmax(0,1fr)}
.shell.rail-collapsed{--sidebar-width:72px}
.sidebar{height:100dvh;gap:0;padding:0;background:var(--surface)}
.work-area{min-width:0}
.brand-row{
  display:flex;align-items:center;min-height:var(--header-height);padding:0 20px;border-bottom:1px solid var(--line)
}
.sidebar .brand{margin:0}
.brand img{width:33px;height:33px}
.switcher-row{padding:12px;border-bottom:1px solid var(--line)}
.area-picker{position:relative;color:var(--text)}
.area-picker>summary{
  display:flex;align-items:center;gap:11px;list-style:none;padding:8px;border-radius:12px;min-height:55px
}
.area-picker>summary::-webkit-details-marker{display:none}
.area-picker>summary:hover,.area-picker[open]>summary{background:var(--soft)}
.area-symbol{
  display:grid;place-items:center;flex:none;background:var(--accent);color:var(--surface);
  width:40px;height:40px;border-radius:13px
}
.area-symbol .icon{width:21px;height:21px}
.area-copy{flex:1;min-width:0;line-height:1.3}
.area-copy strong,.area-copy small{display:block}
.area-copy strong{font-size:15px;font-weight:695}
.area-copy small{color:var(--muted);font-size:12px;margin-top:2px}
.area-menu{
  position:absolute;z-index:10;top:100%;left:0;min-width:195px;display:grid;padding:5px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 3px 14px color-mix(in srgb,var(--ink-700) 12%,transparent)
}
.area-menu a,.more-panel a{
  display:flex;align-items:center;min-height:44px;padding:9px;border-radius:8px;text-decoration:none;
  color:var(--text);font-size:14px
}
.area-menu a:hover,.more-panel a:hover{background:var(--accent-soft);color:var(--accent-text)}
.grouped{padding:14px 12px 8px;display:grid;gap:15px;align-content:start;overflow:auto;flex:1}
.nav-group{display:grid;gap:2px}
.nav-group>p{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.055em;color:var(--muted);padding:1px 12px 4px}
.grouped a,.grouped .nav-context,.sidebar-links .nav-context{
  min-height:40px;display:flex;gap:11px;align-items:center;padding:7px 12px;border-radius:12px;
  text-decoration:none;font-size:14px;font-weight:550;color:var(--muted);position:relative
}
.grouped .icon,.sidebar-links .icon,.collapse-btn .icon{width:19px;height:19px}
.grouped a[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
.grouped a[aria-current]::before{
  content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)
}
.grouped a:not([aria-current]):hover{background:var(--soft)}
.sidebar-bottom{margin-top:auto}
.sidebar-links{border-top:1px solid var(--line);padding:6px 12px}
.collapse-btn{
  border:0;border-top:1px solid var(--line);background:none;width:100%;min-height:47px;
  padding:10px 24px;display:flex;align-items:center;gap:11px;color:var(--muted);font-size:14px;text-align:start
}
.collapse-btn:hover{background:var(--soft)}
.preview-note{margin:0 0 9px;text-align:center;font-size:10px}
.sidebar-reduced :is(.brand span,.area-copy,.area-picker>summary>.icon,.nav-group>p,.nav-group :is(a,.nav-context)>span,.sidebar-links .nav-context>span,.collapse-btn>span,.preview-note){display:none}
.sidebar-reduced .brand-row,.sidebar-reduced .area-picker>summary,.sidebar-reduced .nav-group :is(a,.nav-context),.sidebar-reduced .collapse-btn,.sidebar-reduced .sidebar-links .nav-context{justify-content:center;padding-inline:0}
.sidebar-reduced .switcher-row,.sidebar-reduced .grouped{padding-inline:8px}
.prototype-bar{
  min-height:32px;color:var(--amber-text);background:var(--amber-bg);display:flex;
  align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:540
}
.topbar{
  position:sticky;top:0;z-index:6;min-height:var(--header-height);padding:0 24px;
  margin:0;background:var(--page);border-bottom:1px solid var(--line);gap:12px
}
.top-leading,.top-trailing,.global-search,.guide-btn{display:flex;align-items:center;gap:9px}
.top-leading{min-width:0;flex:1 1 560px}
.top-trailing{gap:14px;flex:none}
.global-search{
  min-width:0;width:min(100%,386px);height:40px;padding:7px 11px;color:var(--muted);background:var(--soft);
  border:1px solid var(--line);border-radius:15px;font-size:14px
}
.global-search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.global-search kbd{margin-left:auto;font-size:11px;padding:1px 4px;border-radius:7px;border:1px solid var(--line);background:var(--page);white-space:nowrap}
.topbar .help-btn{
  border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);padding-inline:14px
}
.topbar .help-btn:hover{background:var(--soft)}
.guide-btn{border:0;background:none;min-height:44px;padding:5px 0;font-size:14px;font-weight:600}
.guide-btn:hover{color:var(--accent-text)}
.header-org{font-size:14px;white-space:nowrap}
.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--stone-100);color:var(--ink-700);font-weight:600;font-size:14px}
.mobile-area,.bottom-tabs,.more-panel,.section-select{display:none}
.container{padding:24px 24px 43px;max-width:1480px}
.heading h1,.flow .heading h1{font-size:32px;line-height:1.14;letter-spacing:-.045em;font-weight:735}
.heading p{color:var(--muted)}
.heading{margin-bottom:19px}
.console .heading h1{color:var(--text)}
.btn{border-radius:10px}
.btn:hover{background:var(--accent-text);border-color:var(--accent-text)}
.btn.admin{background:var(--ametista-600);border-color:var(--ametista-600)}
.section-tabs{
  display:flex;gap:4px;align-items:end;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:20px
}
.section-tabs :is(a,span){display:inline-flex;align-items:center;min-height:44px;padding:8px 11px;white-space:nowrap;font-size:14px;text-decoration:none;border-bottom:2px solid transparent;color:var(--muted)}
.section-tabs a[aria-current]{border-color:var(--accent);color:var(--accent-text);font-weight:680}
.section-tabs a:not([aria-current]):hover{color:var(--text)}
.records{padding:0;overflow:hidden}
.records-bar{padding:14px;border-bottom:1px solid var(--line)}
.records-bar input{max-width:448px}
.product-list{padding:0;list-style:none}
.product-row{
  display:grid;grid-template-columns:minmax(145px,1.65fr) minmax(102px,.65fr) minmax(112px,.8fr) minmax(140px,auto);
  align-items:center;gap:10px;padding:12px 14px;min-height:64px;border-bottom:1px solid var(--line)
}
.product-list li:last-child{border-bottom:0}
.records-header{min-height:38px;background:var(--soft);font-size:12px;color:var(--muted);font-weight:650}
.product-name{display:flex;align-items:center;gap:9px;min-width:0}
.product-name .monogram{width:39px;height:39px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--ink-100);color:var(--ink-600);font-size:12px;font-weight:710}
.product-name strong,.product-name small{display:block}
.product-name strong{font-size:14px;overflow-wrap:anywhere}
.product-name small,.product-col-channels{color:var(--muted);font-size:13px}
.staff-filter{max-width:280px;margin-bottom:16px;display:grid;gap:5px;font-size:14px;font-weight:620}
.staff-filter select{min-height:var(--control);background:var(--surface);border:1px solid var(--stone-500);border-radius:9px;padding:8px 9px}
.sidebar>nav .nav-context{display:flex}
.side-by-side{display:grid;gap:12px}
@media (min-width:768px) and (max-width:1023px){
  .shell{--sidebar-width:72px;display:grid}
  .sidebar{display:flex}
  .sidebar :is(.brand span,.area-copy,.area-picker>summary>.icon,.nav-group>p,.nav-group :is(a,.nav-context)>span,.sidebar-links .nav-context>span,.collapse-btn,.preview-note){display:none}
  .sidebar .brand-row,.sidebar .area-picker>summary,.sidebar .nav-group :is(a,.nav-context),.sidebar .sidebar-links .nav-context{justify-content:center;padding-inline:0}
  .sidebar .switcher-row,.sidebar .grouped{padding-inline:8px}
  .sidebar .area-menu{left:45px;top:0}
  .topbar{padding-inline:18px}
}
@media (max-width:767px){
  .shell{display:block}
  .sidebar{display:none}
  .topbar{min-height:var(--header-height);margin-bottom:0;padding:0 11px;gap:0}
  .top-leading,.top-trailing{flex:none;gap:0}
  .global-search,.guide-btn{display:grid;place-items:center;min-height:44px;width:44px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--text)}
  .global-search :is(span,kbd),.guide-btn span,.header-org{display:none}
  .topbar .help-btn{font-size:0;gap:0;width:44px;padding:0}
  .topbar .help-btn .icon{width:20px;height:20px}
  .mobile-area{display:block;flex:1;min-width:0;font-size:14px;line-height:1.25}
  .mobile-area small{display:block;color:var(--muted);font-size:12px}
  .avatar{width:37px;height:37px}
  .container{padding:16px 16px calc(var(--bottom-nav-height) + 26px + env(safe-area-inset-bottom))}
  .heading h1,.flow .heading h1{font-size:26px}
  .heading p{font-size:15px}
  .bottom-tabs{
    z-index:8;position:fixed;inset:auto 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
    min-height:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom));
    padding:4px 0 env(safe-area-inset-bottom);border-top:1px solid var(--line);background:var(--page)
  }
  .bottom-tabs :is(a,button,.bottom-context){
    position:relative;min-height:51px;padding:4px 1px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:600;text-align:center;line-height:1.2
  }

  .bottom-tabs a[aria-current]{color:var(--accent-text)}
  .bottom-tabs a[aria-current]::before{
    content:"";height:3px;width:37px;border-radius:0 0 4px 4px;position:absolute;top:-4px;background:var(--accent)
  }
  .bottom-icon{display:grid;place-items:center;width:48px;height:28px;border-radius:100px}
  .bottom-icon .icon{width:21px;height:21px}
  .bottom-tabs a[aria-current] .bottom-icon{background:var(--accent-soft)}
  .more-panel{
    display:grid;z-index:9;position:fixed;inset:auto 12px calc(var(--bottom-nav-height) + 6px + env(safe-area-inset-bottom));
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px;
    box-shadow:0 2px 12px color-mix(in srgb,var(--ink-700) 14%,transparent)
  }
  .section-tabs{display:none}
  .section-select{display:block;margin:1px 0 15px}
  .section-select select{
    background:var(--page);color:var(--text);min-height:44px;width:100%;
    border:1px solid var(--stone-500);border-radius:10px;padding:8px 12px;font-size:14px
  }
  .workspace{display:block}
  .workspace[data-detail="false"] .pane{display:none}
  .workspace[data-detail="true"] .queue{display:none}
  .workspace[data-detail="false"] .next-mobile{
    display:flex;align-items:center;justify-content:space-between;gap:7px;
    background:var(--action-bg);border:1px solid var(--terra-200);border-radius:12px;
    margin-bottom:11px;padding:9px 10px
  }
  .next-mobile span{font-size:12px;color:var(--accent-text);font-weight:680}
  .next-mobile strong{display:block;font-size:14px;color:var(--text)}
  .detail-intro .heading{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .detail-intro .toolbar{margin-bottom:5px}
  .detail-intro+.roadmap{display:none}
  .product-row{grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:10px 12px}
  .product-row .btn{font-size:13px}
  .records-header,.product-col-channels{display:none}
  .product-row>div:last-child{grid-column:1/-1}
  .staff-filter{margin-top:2px}
}
@media (max-width:375px){
  .container{padding-inline:12px}
  .topbar{padding-inline:8px}
  .bottom-tabs :is(a,button,.bottom-context){font-size:10px}
}

.roadmap{position:relative;--phase:0;--phase-gap:9px}
.roadmap[data-phase="portali"]{--phase:1}
.roadmap[data-phase="adempimenti"]{--phase:2}
.roadmap::after{
  pointer-events:none;position:absolute;left:0;bottom:-5px;content:"";height:2px;border-radius:3px;
  width:calc((100% - var(--phase-gap) * 2) / 3);
  transform:translateX(calc(var(--phase) * (100% + var(--phase-gap))));
  background:var(--accent);opacity:1
}
.roadmap[data-phase="tutti"]::after,.roadmap[data-phase="completati"]::after{opacity:0}
#command{
  width:min(100% - 28px,580px);max-width:none;margin:90px auto auto;padding:0;
  border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--text);
  box-shadow:0 10px 50px color-mix(in srgb,var(--ink-700) 21%,transparent)
}
#command::backdrop{background:color-mix(in srgb,var(--ink-700) 35%,transparent)}
.command-inner{display:grid}
.command-head{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line)}
.command-head>input{
  flex:1;min-width:0;min-height:44px;padding:5px;background:none;border:0;font-size:15px;
  color:var(--text);border-radius:7px
}
.command-head>input::placeholder{color:var(--muted)}
.command-head>input:focus-visible{outline-offset:1px}
#command-results{padding:10px;list-style:none;margin:0;max-height:min(58dvh,412px);overflow:auto}
#command-results ul{padding:0;list-style:none}
.command-group{font-size:12px;font-weight:680;color:var(--muted);padding:8px 8px 4px}
#command-results [role="option"]{
  display:grid;grid-template-columns:18px minmax(0,1fr) 17px;gap:10px;align-items:center;
  min-height:48px;padding:8px;border-radius:8px;cursor:pointer;font-size:14px
}
#command-results [role="option"]>span>small{display:block;font-size:12px;color:var(--muted)}
#command-results [aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text)}
#command-results [role="option"]:hover{background:var(--soft)}
.command-foot{display:flex;gap:12px;padding:9px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){
  .roadmap::after{transition:transform 180ms cubic-bezier(.2,0,0,1),opacity 130ms}
  #command[open]{animation:command-in 140ms ease-out}

}
@media(max-width:767px){

}
@media(max-width:675px){
  .roadmap{--phase-gap:5px}
}

#staff-action{
  width:min(100% - 28px,480px);max-width:none;padding:20px;border:1px solid var(--line);border-radius:16px;
  background:var(--surface);color:var(--text);box-shadow:0 10px 50px color-mix(in srgb,var(--ink-700) 21%,transparent)
}
#staff-action::backdrop{background:color-mix(in srgb,var(--ink-700) 35%,transparent)}

  {id:'adempimenti', title:'Adempimenti', icon:'shield', hint:'Configura i servizi'}
];

  schede:['Da completare','amber'], portali:['Portali in corso','amber'],
  adempimenti:['Adempimenti disponibili','blue'], completati:['Sincronizzato','green']
};

  mapping:['Da mappare','amber'], reservations:['Mappato','blue'], calendar:['Prenotazioni importate','blue'],
  mark:['Pronto da attivare','blue'], verify:['In sincronizzazione','blue'], synced:['Sincronizzato','green']
};

};
const state = {
  railCollapsed:false, staffFilter:'open', filter:'tutti', query:'', selectMode:false, selection:new Set(), portalScope:[],
  scopeMode:{}, priceOverride:null, staffJob:'ready', support:{
    'assist-demo':{p:byId.urban,label:'Verifica collegamento portale',status:'inProgress'},
    'assist-demo-open':{p:byId.lario,label:'Verifica associazione Airbnb',status:'requested'}
  },
  portalCheck:[], provisioned:new Set(), staffNotes:{}, flash:'', opener:null, queueScroll:0
};
const views = new Set(['immobili','canali','processi','attivazione','immobile','revisione','scheda','prezzi','portali','portale','adempimenti','servizio','integrazioni','staff','lotto','richiesta']);
function where() {
  const [view, id, rest] = location.hash.slice(1).split('/');
  if (!views.has(view)) return {view:'attivazione'};
  return {view, id, rest};
}
function propertyAt(route) {
  const id = route.view === 'servizio' ? route.rest : route.id;
  if (route.view === 'portale') return byId[route.rest] || byId[state.portalScope[0]] || byId.lario;
  return byId[id] || byId.lario;
}
function stage(p) {
  if (!p.published) return 'schede';
  if (!p.ready || (!p.noPortals && (!Object.keys(p.channels).length || Object.values(p.channels).some(status => status !== 'synced')))) return 'portali';
  if (p.country === 'IT' && !Object.keys(services).every(service => p.duties[service] === 'configured')) return 'adempimenti';
  return 'completati';
}
function announce(text) {
  announcement.textContent = text;
}
function go(hash, message = '') {
  state.flash = message;
  const target = '#' + hash;
  if (location.hash === target) render(true);
  else location.hash = target;
}
function link(label, route, kind = '', pictogram = '') {
  return '<a class="btn ' + kind + '" href="#' + route + '">' + e(label) + (pictogram ? icon(pictogram,'small') : '') + '</a>';
}
function button(label, action, value = '', kind = '', pictogram = '') {
  return '<button type="button" class="btn ' + kind + '" data-action="' + action + '" data-value="' + e(value) + '">' + e(label) + (pictogram ? icon(pictogram,'small') : '') + '</button>';
}
function back(label, route) {
  return '<a class="back" href="#' + route + '">' + icon('back','small') + e(label) + '</a>';
}
function helpButton(context = '', label = 'Chiedi a CasaZen') {

}
function pill(label, type = 'gray', sym = '') {

}
function notice(text, kind = '') {

}
function title(main, intro = '') {

}
function flowHead(backText, backTo, main, intro, context = '') {
  return '<header class="flow-head">' + back(backText,backTo) + (context ? '<p class="flow-label">' + e(context) + '</p>' : '') + title(main,intro) + '</header>';

function panel(heading, html, classes = '') {
  return '<section class="card box ' + classes + '"><h2>' + e(heading) + '</h2>' + html + '</section>';
}
function kindButton(style, label, value, extra = '') {

}
function brand(collapsed = false) {

}
const hostNavigation = [
  ['Ogni giorno', [['dashboard','Cruscotto'],['calendar','Calendario'],['file','Prenotazioni'],['message','Messaggi'],['shield','Adempimenti','adempimenti/varenna']]],
  ['La tua offerta', [['home','Immobili','immobili'],['world','Sito di prenotazione'],['store','Marketplace','portali']]],
  ['Gestione', [['credit','Incassi']]]
];
const staffNavigation = [
  ['Piattaforma', [['dashboard','Cruscotto'],['users','Utenti'],['store','Fornitori'],['users','Inviti']]],
  ['Supporto', [['wrench','Richieste di aiuto','staff']]],
  ['Contenuti', [['world','SEO & Contenuti']]],
  ['Sistema', [['shield','Conformità'],['settings','Processi','processi']]]

function mainRoute(view) {
  if (['staff','richiesta'].includes(view)) return 'staff';
  if (['lotto','processi'].includes(view)) return 'processi';
  if (['adempimenti','servizio'].includes(view)) return 'adempimenti/varenna';
  if (['portale','portali'].includes(view)) return 'portali';
  return 'immobili';
}

    '<span class="nav-context" title="' + e(label) + '">' + contents + '</span>';
}
function sideMenu(view, staff) {

function sectionTabs(items, active, label) {

const propertyTabs = [['Immobili','immobili'],['Interventi'],['Canali e calendari','canali'],['Attivazione','attivazione']];
const processTabs = [['Processi','processi'],['Configurazione AI'],['Ambiente demo'],['Preparazione strutture','lotto']];
function isStaff(view) {
  return ['staff','lotto','richiesta','processi'].includes(view);
}

function eligible(p) {
  return p.published && p.ready;
}
function propertyAction(p) {
  const group = stage(p);
  if (group === 'schede') return {title:p.issues.every(issue => issue.confirmed) ? 'Pubblica la scheda' : 'Rivedi i dati mancanti', desc:'Conferma i dati della scheda per continuare con i collegamenti.', label:'Apri scheda', route:'scheda/' + p.id};
  if (group === 'portali') {
    if (!p.ready) return {title:'Preparazione in corso',desc:'Il team sta verificando la struttura. Puoi continuare con gli altri immobili.',label:'Vedi integrazioni',route:'integrazioni/' + p.id};
    const unfinished = Object.keys(p.channels).find(key => p.channels[key] !== 'synced');
    if (!unfinished) return {title:'Scegli i portali da collegare',desc:'Seleziona il portale che usi per questo immobile.',label:'Aggiungi un portale',route:'portali/' + p.id};
    const details = {
      authorize:['Completa l’autorizzazione','Il portale attende la conferma per questo immobile.','Riprendi autorizzazione'],
      waiting:['Verifica il collegamento','Puoi lavorare sugli altri immobili mentre il portale risponde.','Vedi verifica'],
      rooms:['Rileva le camere','Recupera le camere da associare all’immobile.','Continua il collegamento'],
      mapping:['Associa le camere','Conferma l’associazione prima di importare le prenotazioni.','Apri associazioni'],
      reservations:['Verifica le prenotazioni','Importa e riconcilia le prenotazioni future.','Continua il collegamento'],
      calendar:['Controlla il calendario','Verifica quale fonte fornisce prezzi e disponibilità.','Continua il collegamento'],
      mark:['Attiva la connessione','Il mapping e gli import richiesti sono pronti.','Continua il collegamento'],
      verify:['Controlla la sincronizzazione','Verifica prenotazioni, prezzi e disponibilità sui dati effettivi.','Vedi verifica']
    };
    const [heading,desc,label] = details[p.channels[unfinished]];
    return {title:heading + ' ' + providers[unfinished].name, desc, label, route:'portale/' + unfinished + '/' + p.id};
  }
  if (group === 'adempimenti') {
    const waiting = Object.keys(services).some(key => ['requested','inProgress'].includes(p.duties[key]));
    return {title:waiting ? 'Segui la richiesta al team' : 'Configura gli adempimenti', desc:'I portali richiesti sono sincronizzati per questo immobile.',label:waiting ? 'Vedi servizi e richieste' : 'Apri adempimenti',route:'adempimenti/' + p.id};
  }
  return {title:'Attivazione completata',desc:'I collegamenti richiesti sono operativi per questo immobile.', label:'Vedi integrazioni',route:'integrazioni/' + p.id};
}
function roadmap() {
  return '<ol class="roadmap" data-phase="' + state.filter + '" aria-label="Fasi di attivazione">' + phases.map(phase => {
    const total = properties.filter(p => stage(p) === phase.id).length;
    return '<li><a href="#attivazione" data-action="filter" data-value="' + phase.id + '"' + (state.filter === phase.id ? ' aria-current="true"' : '') + '><span class="symbol">' + icon(phase.icon) + '</span><span><strong>' + phase.title + '</strong><small>' + phase.hint + '</small></span><span class="count" aria-label="' + total + ' immobili">' + total + '</span></a></li>';
  }).join('') + '</ol>';
}
function queueVisible() {
  const query = state.query.trim().toLocaleLowerCase('it');
  return properties.filter(p => (state.filter === 'tutti' || stage(p) === state.filter) && (p.name + ' ' + p.place).toLocaleLowerCase('it').includes(query));
}
function queueRows(items, selectedId) {
  if (!items.length) return '<p class="empty">Nessun immobile corrisponde ai filtri.</p>';
  return items.map(p => {
    const selected = p.id === selectedId;
    const status = propertyStates[stage(p)];
    const check = state.selectMode && eligible(p) ? '<label class="check-slot"><input type="checkbox" data-property="' + p.id + '" aria-label="Seleziona ' + e(p.name) + '"' + (state.selection.has(p.id) ? ' checked' : '') + '></label>' : '';
    return '<article class="qrow' + (selected ? ' current' : '') + '">' + check + '<a href="#immobile/' + p.id + '"' + (selected ? ' aria-current="true"' : '') + '><span class="monogram" aria-hidden="true">' + p.mark + '</span><span><span class="qtitle">' + e(p.name) + '</span><span class="qmeta">' + p.place + '</span><span class="qsignal">' + pill(...status) + '</span></span><span class="chev">' + icon('next','small') + '</span></a></article>';
  }).join('');
}
function bulkSummary() {
  const count = state.selection.size;
  return '<div class="bulk-box"><span>' + (count ? count + ' selezionat' + (count === 1 ? 'o' : 'i') : 'Seleziona gli immobili pronti') + '</span>' + (count ? button('Scegli il portale','bulk-portals','','ink') : '') + '</div>';
}
function queue(selectedId) {

function timelineStep(index, label, status, desc, content, mode) {

function propertyPane(p) {

  const group = stage(p);
  const linked = Object.entries(p.channels);
  const readyChannels = p.noPortals || (linked.length > 0 && linked.every(([, value]) => value === 'synced'));
  const dutiesUnlocked = p.ready && p.published && readyChannels && p.country === 'IT';
  const dutiesDone = p.country === 'IT' && Object.keys(services).every(key => p.duties[key] === 'configured');
  const channelList = linked.length ? '<div class="channels">' + linked.map(([key, value]) => '<div class="channel"><span>' + providers[key].name + '</span>' + pill(...portalStates[value]) + '</div>').join('') + '</div>' : '';
  const tasks = dutiesUnlocked ? '<div class="channels">' + Object.entries(services).map(([key, service]) => '<div class="channel"><span>' + service.name + '</span>' + pill(...dutyStatus(p.duties[key])) + '</div>').join('') + '</div>' : '';
  return '<section class="pane" id="property-pane" aria-label="Dettaglio immobile" tabindex="-1"><header class="property-head"><div class="property-identity"><span class="property-mark" aria-hidden="true">' + p.mark + '</span><div><h2>' + p.name + '</h2><p class="place">' + icon('pin','small') + p.place + '</p></div></div>' + pill(...propertyStates[group]) + '</header><div class="pane-body"><div class="next"><p class="next-label">Prossimo passo</p><h3>' + e(action.title) + '</h3><p>' + e(action.desc) + '</p><div class="actions">' + link(action.label,action.route,'','arrow') + helpButton('immobile/' + p.id,'Spiegami il passaggio') + '</div></div><h3>Percorso di attivazione</h3><ol class="timeline">'
    + timelineStep(1,'Scheda CasaZen',p.published ? ['Pubblicata','green'] : ['Da completare','amber'],p.published ? 'Scheda verificata e visibile in CasaZen.' : 'Conferma le informazioni prima della pubblicazione.','',p.published ? 'done' : 'now')
    + timelineStep(2,'Struttura per i collegamenti',p.ready ? ['Pronta','green'] : ['In attesa','gray'],p.ready ? 'La struttura può collegare i portali.' : 'Preparazione a cura del team CasaZen.','',p.ready ? 'done' : '')
    + timelineStep(3,'Portali di prenotazione',p.noPortals ? ['Non richiesti','gray'] : readyChannels ? ['Sincronizzati','green'] : ['Da completare','amber'],p.noPortals ? 'Hai scelto di attivare la struttura senza portali.' : linked.length ? 'Segui ogni connessione separatamente.' : 'Scegli i portali dopo che la struttura è pronta.',channelList,readyChannels ? 'done' : p.ready && p.published ? 'now' : '')
    + timelineStep(4,'Adempimenti',p.country !== 'IT' ? ['Non applicabile qui','gray'] : dutiesDone ? ['Configurati','green'] : dutiesUnlocked ? ['Disponibili','blue'] : ['In attesa dei portali','gray'],p.country !== 'IT' ? 'I servizi disponibili dipendono dal paese della struttura.' : dutiesUnlocked ? 'Alloggiati e ISTAT si gestiscono separatamente.' : 'Si aprono dopo la sincronizzazione dei portali richiesti.',tasks,dutiesDone ? 'done' : dutiesUnlocked ? 'now' : '')
    + '</ol><div class="pane-actions">' + (p.id === 'lario' ? '<a class="quiet" href="#prezzi/lario">Prezzi e provenienza ' + icon('next','small') + '</a>' : '') + (eligible(p) ? '<a class="quiet" href="#portali/' + p.id + '">Aggiungi un portale ' + icon('next','small') + '</a>' : '') + '<a class="quiet" href="#integrazioni/' + p.id + '">Altre integrazioni ' + icon('next','small') + '</a>' + (eligible(p) && !readyChannels && !linked.length ? '<button type="button" class="quiet" data-action="no-portal" data-value="' + p.id + '">Nessun portale</button>' : '') + '</div></div></section>';
}
function dashboard(route) {
  const explicit = route.view === 'immobile' && Boolean(byId[route.id]);
  const selected = explicit ? byId[route.id] : queueVisible()[0];
  const selectedId = selected?.id || '';
  const header = explicit ? '<div class="toolbar">' + title('Attivazione immobili') + back('Tutti gli immobili','attivazione') + '</div>' : title('Attivazione immobili','Controlla cosa manca per ogni immobile e riprendi da dove eri rimasto.');
  return '<div class="' + (explicit ? 'detail-intro' : '') + '">' + header + '</div>' + (explicit ? '' : sectionTabs(propertyTabs,'attivazione','Sezione Immobili')) + roadmap() + '<div class="workspace" data-detail="' + explicit + '" data-selected="' + selectedId + '"><div class="next-mobile"' + (selected ? '' : ' hidden') + '><div><span>Prossimo passo</span><strong>' + (selected?.name || '') + '</strong></div>' + link('Riprendi','immobile/' + selectedId,'ink','arrow') + '</div>' + queue(selectedId) + (selected ? propertyPane(selected) : '') + '</div>';

function review() {
  const list = properties.filter(p => !p.published);
  return title('Revisione annunci','Conferma solo i campi incerti. Gli altri dati restano nella scheda con la loro provenienza.') + '<div class="split"><div class="flow">' +
    (!list.length ? panel('Schede pronte',notice('Tutte le schede di esempio sono pubblicate.','success')) : list.map(p => {
      const unresolved = p.issues.filter(issue => !issue.confirmed);
      return panel(p.name,'<p class="muted compact">' + e(unresolved.length ? unresolved.map(issue => issue.title).join(' · ') : 'Dati confermati. Puoi pubblicare la scheda.') + '</p><div class="actions">' + link('Apri la scheda','scheda/' + p.id,'secondary','arrow') + '</div>');
    }).join('')) + '</div>' +
    panel('Dati importati', '<p class="compact">Le fonti rendono verificabili prezzi e dati già precompilati.</p><div class="actions">' + link('Vedi prezzi e fonti','prezzi/lario','secondary','arrow') + '</div>', 'aside-info') + '</div>';
}

  const rows = p.issues.map(issue => panel(issue.title,
    '<p class="muted compact">' + issue.summary + '</p><div class="source-box"><strong>Fonte</strong><p>' + issue.source + '</p></div>' +
    (issue.confirmed ? '<p>' + pill('Confermato','green','check') + ' ' + e(issue.value) + '</p>' :
      '<form class="flow" data-form="issue" data-id="' + p.id + '" data-extra="' + issue.id + '"><label class="field">' + issue.label + '<select name="resolution" required><option value="">Seleziona</option>' + issue.options.map(option => '<option>' + e(option) + '</option>').join('') + '</select></label><div>' + kindButton('','Conferma il campo','confirm') + '</div></form>')
  )).join('');

function aid(route, p) {
  if (isStaff(route.view)) return {
    title:'Da dove riprendo?',body:'Controlla le righe in attesa e rileggi gli esiti incerti prima di ritentare.',
    source:'Ultimo esito della struttura e riscontro Octorate.',route:'lotto',action:'Apri il lotto'
  };
  if (route.view === 'scheda' || route.view === 'revisione') {
    const issue = p.issues.find(entry => !entry.confirmed);
    return {title:'Quale dato devo controllare?',body:issue ? issue.summary : 'Rivedi le fonti per i campi che richiedono conferma.',
      source:issue ? issue.source : 'Esiti della revisione CasaZen.',route:issue ? 'scheda/' + p.id : 'revisione',action:'Apri la revisione'};
  }
  if (route.view === 'prezzi') return {
    title:'Da dove viene la tariffa?',body:'La tariffa iniziale deriva dal piano non rimborsabile osservato. Gli altri piani mantengono la propria provenienza.',
    source:'KrossBooking · 10–12 dicembre 2026 · 2 ospiti.',route:'prezzi/lario',action:'Controlla i prezzi'
  };
  if (route.view === 'adempimenti' || route.view === 'servizio') return {
    title:'Quando serve il team?',body:'Lo staff verifica il profilo e la configurazione dell’ente. La richiesta resta visibile nell’attivazione.',
    source:'Stato dei portali e paese della struttura CasaZen.',route:'adempimenti/' + p.id,action:'Apri gli adempimenti'
  };
  if (route.view === 'portali' && !route.id) return {
    title:'Quale portale devo scegliere?',body:'Parti da un portale che usi già. CasaZen ti guida nella selezione degli immobili e nei requisiti di collegamento.',
    source:'Catalogo e disponibilità della struttura.',route:'portali',action:'Vedi i portali'
  };
  if (route.view === 'portale' && providers[route.id]) {
    const provider = providers[route.id];
    const status = p.channels[route.id];
    return {title:'Come proseguo con ' + provider.name + '?',body:status ? 'Lo stato per questo immobile è «' + portalStates[status][0] + '». Il passaggio successivo è nella scheda del collegamento.' : provider.description,
      source:'Capacità del portale e stato del collegamento per immobile.',route:'portale/' + route.id + (eligible(p) ? '/' + p.id : ''),action:'Vedi il collegamento'};
  }
  if (p.channels.airbnb === 'authorize') return {
    title:'Perché devo autorizzare Airbnb?',body:'Booking.com è già sincronizzato. Airbnb attende la conferma per questo immobile. Puoi continuare a lavorare sulle altre strutture.',
    source:'Stato delle connessioni di ' + p.name + ' in CasaZen.',route:'portale/airbnb/' + p.id,action:'Apri il passaggio Airbnb'
  };
  const action = propertyAction(p);
  return {title:'Qual è il prossimo passo?',body:action.desc,source:'Stato dell’attivazione di ' + p.name + '.',route:action.route,action:action.label};
}
function openHelp(context, opener) {
  const [view,id,rest] = context.split('/');
  const parsed = context ? {view,id,rest} : where();
  const workspaceSelection = app.querySelector('.workspace')?.dataset.selected;
  const p = workspaceSelection && !context ? byId[workspaceSelection] : propertyAt(parsed);
  const answer = aid(parsed,p);
  const staffMode = isStaff(parsed.view);
  const requestId = 'assist-' + p.id;
  state.opener = opener;
  dialog.innerHTML = '<div class="dialog-inner"><header class="dialog-head"><span class="group-title">' + icon('spark') + 'Chiedi a CasaZen</span><button class="quiet" type="button" data-dialog="close" autofocus>Chiudi</button></header><div class="box"><h2 id="help-title">' + e(answer.title) + '</h2><p class="muted compact">' + p.name + '</p></div>' +
    panel('Suggerimento','<p class="compact">' + e(answer.body) + '</p><div class="source-box"><strong>Base del suggerimento</strong><p>' + e(answer.source) + '</p></div><div>' + link(answer.action,answer.route,'ink','arrow') + '</div>','aside-help') +
    (!staffMode ? panel('Supporto del team', state.support[requestId] ? notice('Richiesta dimostrativa registrata.','success') :
      '<p class="compact">Se serve una verifica, puoi inoltrare al team il passaggio e l’immobile selezionati.</p><button type="button" class="quiet" data-dialog="preview">Vedi anteprima della richiesta</button><div class="source-box" id="support-preview" hidden><p><strong>Immobile</strong> ' + p.name + '</p><p><strong>Passaggio</strong> ' + e(answer.title) + '</p><button type="button" class="btn secondary" data-dialog="send" data-context="' + e(answer.title) + '" data-property="' + p.id + '">Conferma richiesta di prova</button></div>') : '') +
    '<p class="muted compact">Assistenza dimostrativa</p></div>';
  dialog.showModal();
}

function processEntry() {

    sectionTabs(processTabs,'processi','Sezione Processi') +
    panel('Preparazione strutture', '<p class="compact muted">Verifica creazione, abilitazione e ripresa del lotto Quokka360.</p><div>' + link('Apri il lotto','lotto','admin','arrow') + '</div>');
}

function contentFor(route) {
  const p = propertyAt(route);
  switch (route.view) {
    case 'immobili': return propertiesEntry();
    case 'canali': return channelOverview();
    case 'processi': return processEntry();
    case 'attivazione':
    case 'immobile': return dashboard(route);
    case 'revisione': return review();
    case 'scheda': return listing(p);
    case 'prezzi': return pricing();
    case 'portali': return portalCatalog(route);
    case 'portale': return portal(route);
    case 'adempimenti': return duties(p);
    case 'servizio': return serviceView(p,route.id);
    case 'integrazioni': return integrations(p);
    case 'staff': return staff();
    case 'lotto': return batch();
    case 'richiesta': return staffRequest(route.id);
  }
}
function render(moveFocus = false) {
  const route = where();
  const staffMode = isStaff(route.view);
  const ch = chrome(route.view,staffMode);
  const flash = state.flash;
  state.flash = '';
  document.documentElement.dataset.area = staffMode ? 'admin' : 'short-rent';
  app.classList.toggle('rail-collapsed',state.railCollapsed);
  app.innerHTML = ch.side + '<div class="work-area">' + ch.top + '<main class="main' + (staffMode ? ' console' : '') + '" id="contenuto" tabindex="-1"><div class="container">' +
    (flash ? '<div class="status-banner">' + notice(flash,'success') + '</div>' : '') + contentFor(route) + '</div></main>' + ch.bottom + '</div>';
  if (flash) announce(flash);
  if (moveFocus) {
    const narrow = matchMedia('(max-width:767px)').matches;
    const destination = narrow && route.view === 'immobile' ? document.querySelector('#property-pane') : document.querySelector('#contenuto');
    destination?.focus({preventScroll:true});
  }
}
function updateQueue() {
  const workspace = app.querySelector('.workspace');
  if (!workspace) return;
  const visible = queueVisible();
  const count = visible.length;
  const selectedId = workspace.dataset.selected;
  const nextSelected = visible.find(p => p.id === selectedId) || visible[0];
  const rail = app.querySelector('#queue-rows');
  rail.innerHTML = queueRows(visible, nextSelected?.id);
  if (selectedId !== nextSelected?.id) {
    const pane = app.querySelector('#property-pane');
    if (nextSelected) {
      if (pane) pane.outerHTML = propertyPane(nextSelected);
      else workspace.insertAdjacentHTML('beforeend',propertyPane(nextSelected));
    } else {
      pane?.remove();
    }
    workspace.dataset.selected = nextSelected?.id || '';
    const mobile = workspace.querySelector('.next-mobile');
    if (mobile) {
      mobile.hidden = !nextSelected;
      if (nextSelected) {
        mobile.querySelector('strong').textContent = nextSelected.name;
        mobile.querySelector('a').href = '#immobile/' + nextSelected.id;
      }
    }
  }
  app.querySelector('#queue-count').textContent = count + ' di ' + properties.length + ' immobili';
  announce(count + (count === 1 ? ' immobile visibile.' : ' immobili visibili.'));
}
function errorAt(form, copy) {
  const field = form.querySelector('.form-error');
  if (!field) return;
  field.hidden = false;
  field.textContent = copy;
}
function startChannel(key, p) {
  if (!p || !eligible(p) || !providers[key] || key === 'expedia' || p.channels[key]) return;
  p.noPortals = false;
  p.channels[key] = 'authorize';
}
function handleAction(action, value, element) {
  switch (action) {
    case 'help':
      openHelp(value,element);
      return;
    case 'collapse':
      state.railCollapsed = !state.railCollapsed;
      render();
      app.querySelector('.collapse-btn')?.focus();
      return;
    case 'more': {
      const menu = app.querySelector('#mobile-more');
      menu.hidden = !menu.hidden;
      element.setAttribute('aria-expanded',String(!menu.hidden));
      if (!menu.hidden) menu.querySelector('a')?.focus();
      return;
    }
    case 'global-search':
      openCommand(element);
      return;
    case 'filter':
      if (where().view === 'attivazione') refreshPhase(value);
      else {
        state.filter = value;
        go('attivazione');
      }
      return;
    case 'select-mode':
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.selection.clear();
      render();
      app.querySelector('[data-action="select-mode"]')?.focus();
      return;
    case 'bulk-portals':
      state.portalScope = [...state.selection];
      go('portali/gruppo');
      return;
    case 'no-portal': {
      const p = byId[value];
      if (!p || !eligible(p) || Object.keys(p.channels).length) return;
      p.noPortals = true;
      go('immobile/' + value,'Preferenza salvata. I portali risultano non richiesti per questo immobile.');
      return;
    }
    case 'publish': {
      const p = byId[value];
      if (!p || p.issues.some(issue => !issue.confirmed)) return;
      p.published = true;
      go('immobile/' + value,'Scheda pubblicata nel prototipo.');
      return;
    }
    case 'choose-portal-mode':
    case 'choose-duty-mode': {
      const [key,mode] = value.split('/');
      state.scopeMode[key] = mode;
      render();
      app.querySelector('form input')?.focus();
      return;
    }
    case 'portal-check':
      if (!state.portalCheck.includes(value)) state.portalCheck.push(value);
      render(true);
      announce('Richiesta dimostrativa registrata.');
      return;
    case 'start-one': {
      const [key,id] = value.split('/');
      startChannel(key,byId[id]);
      go('portale/' + key + '/' + id,'Collegamento dimostrativo preparato.');
      return;
    }
    case 'advance': {
      const [key,id,from,to] = value.split('/');
      const p = byId[id];
      if (!p || p.channels[key] !== from || !portalStates[to]) return;
      p.channels[key] = to;
      if (from === 'calendar' && !p.calendarHasPrice) p.calendarHasPrice = true;
      go('portale/' + key + '/' + id,to === 'synced' ? 'Sincronizzazione dimostrativa verificata.' : portalStates[to][0] + '.');
      return;
    }
    case 'staff-job':
      state.staffJob = value;
      if (value === 'done') properties.filter(p => p.published && !p.ready).forEach(p => {p.ready = true; state.provisioned.add(p.id);});
      render(true);
      announce('Esiti dimostrativi del lotto aggiornati.');
      return;
    case 'assign-staff':
    case 'resolve-staff':
      openStaffAction(action,value,element);
      return;
  }
}
app.addEventListener('click', event => {
  const action = event.target.closest('[data-action]');
  if (action) {
    event.preventDefault();
    handleAction(action.dataset.action,action.dataset.value,action);
    return;
  }
  const item = event.target.closest('.qrow a,.next-mobile a');
  if (item && where().view === 'attivazione') state.queueScroll = window.scrollY;
});
app.addEventListener('change', event => {
  const node = event.target;
  if (node.hasAttribute('data-section-select') && node.value) {
    go(node.value);
  } else if (node.id === 'staff-filter') {
    state.staffFilter = node.value;
    render();
    app.querySelector('#staff-filter')?.focus();
  } else if (node.id === 'queue-filter') {
    refreshPhase(node.value);
  } else if (node.dataset.property) {
    const id = node.dataset.property;
    if (node.checked) state.selection.add(id);
    else state.selection.delete(id);
    app.querySelector('#bulk').innerHTML = bulkSummary();
    announce(state.selection.size + ' immobili selezionati.');
  } else if (node.name === 'duty-scope') {
    const target = app.querySelector('[data-for-code="' + node.value + '"]');
    if (target) target.hidden = !node.checked;
  }
});
app.addEventListener('input', event => {
  if (event.target.id === 'property-search') {
    const needle = event.target.value.toLocaleLowerCase('it').trim();
    app.querySelectorAll('[data-property-list-item]').forEach(row => {
      row.hidden = !row.dataset.propertyListItem.includes(needle);
    });
  }
  if (event.target.id !== 'queue-query') return;
  state.query = event.target.value;
  updateQueue();
});
app.addEventListener('submit', event => {
  const form = event.target;
  const {form:kind,id,extra} = form.dataset;
  if (!kind) return;
  event.preventDefault();
  const data = new FormData(form);
  switch (kind) {
    case 'issue': {
      const issue = byId[id]?.issues.find(entry => entry.id === extra);
      const resolution = data.get('resolution');
      if (issue && issue.options.includes(resolution)) {
        issue.value = resolution;
        issue.confirmed = true;
        go('scheda/' + id,'Campo confermato.');
      }
      break;
    }
    case 'price': {
      const amount = Number(data.get('amount'));
      if (Number.isFinite(amount) && amount > 0) {
        state.priceOverride = amount.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
        go('prezzi/lario','Tariffa principale aggiornata. I piani originali restano disponibili.');
      }
      break;
    }
    case 'portal-scope': {
      const ids = data.getAll('property').filter(key => byId[key] && eligible(byId[key]));
      if (!ids.length) return errorAt(form,'Seleziona almeno un immobile.');
      state.portalScope = ids;
      go('portale/' + id + '/' + (ids.length === 1 ? ids[0] : 'gruppo'));
      break;
    }
    case 'connect': {
      const shared = state.scopeMode[id + ':' + extra] === 'shared';
      const ids = shared ? data.getAll('scope').filter(key => byId[key] && eligible(byId[key])) : [extra];
      if (!ids.length) return errorAt(form,'Seleziona almeno un immobile.');
      ids.forEach(key => startChannel(id,byId[key]));
      state.portalScope = ids;
      go('portale/' + id + '/' + (ids.length > 1 ? 'gruppo' : ids[0]),'Collegamento dimostrativo preparato.');
      break;
    }
    case 'mapping':
      if (byId[extra]?.channels[id] !== 'mapping' || data.get('room') !== 'match') break;
      byId[extra].channels[id] = 'reservations';
      go('portale/' + id + '/' + extra,'Associazione confermata.');
      break;
    case 'duty': {
      const p = byId[extra];
      if (!p || !services[id] || !unlocked(p)) break;
      const shared = state.scopeMode[id + ':' + extra] === 'shared';
      const ids = shared ? data.getAll('duty-scope').filter(key => byId[key] && unlocked(byId[key]) && byId[key].region === p.region) : [extra];
      if (!ids.length) return errorAt(form,'Seleziona almeno un immobile per questa credenziale.');
      ids.forEach(key => {byId[key].duties[id] = 'requested';});
      go('servizio/' + id + '/' + ids[0],'Richiesta dimostrativa registrata per ' + ids.length + (ids.length === 1 ? ' immobile.' : ' immobili.'));
      break;
    }
  }
});
dialog.addEventListener('click', event => {
  if (event.target.closest('a[href]')) {
    dialog.close();
    return;
  }
  const target = event.target.closest('[data-dialog]');
  if (!target) return;
  if (target.dataset.dialog === 'close') dialog.close();
  if (target.dataset.dialog === 'preview') {
    target.hidden = true;
    const preview = dialog.querySelector('#support-preview');
    preview.hidden = false;
    preview.querySelector('button').focus();
  }
  if (target.dataset.dialog === 'send') {
    const p = byId[target.dataset.property];
    if (!p) return;
    state.support['assist-' + p.id] = {p,label:target.dataset.context,status:'requested'};
    const preview = dialog.querySelector('#support-preview');
    preview.innerHTML = notice('Richiesta dimostrativa registrata.','success');
    preview.tabIndex = -1;
    preview.focus();
    announce('Richiesta dimostrativa registrata.');
  }
});
dialog.addEventListener('close', () => {
  state.opener?.focus();
  state.opener = null;
});
document.querySelector('.skip').addEventListener('click', event => {

  document.querySelector('#contenuto')?.focus();
});
const staffAction = document.querySelector('#staff-action');
let staffActionOpener;
function openStaffAction(action,id,opener) {
  const request = staffRequests().find(item => item.id === id);
  if (!request) return;
  const status = action === 'assign-staff' ? 'inProgress' : 'configured';
  const title = status === 'inProgress' ? 'Prendi in carico la richiesta' : 'Conferma la verifica';
  staffActionOpener = opener;
  staffAction.innerHTML = '<form class="flow" data-status="' + status + '" data-request="' + e(id) + '"><h2 id="staff-action-title">' + title + '</h2><p class="muted compact">' + request.p.name + '</p><label class="field">Nota per l’host <textarea name="note" maxlength="500" rows="3" placeholder="Facoltativa" autofocus></textarea></label><div class="actions"><button type="button" class="btn secondary" data-staff-dismiss>Annulla</button><button type="submit" class="btn admin">Conferma</button></div></form>';
  staffAction.showModal();
}
staffAction.addEventListener('click',event => {
  if (event.target.closest('[data-staff-dismiss]')) staffAction.close();
});
staffAction.addEventListener('close',() => {
  if (staffActionOpener?.isConnected) staffActionOpener.focus();
  staffActionOpener = null;
});
staffAction.addEventListener('submit',event => {
  event.preventDefault();
  const form = event.target;
  const {request:id,status} = form.dataset;
  const request = staffRequests().find(item => item.id === id);
  if (!request || !['inProgress','configured'].includes(status)) return;
  const note = String(new FormData(form).get('note') || '').trim();
  if (note) state.staffNotes[id] = note;
  if (request.type === 'duty') request.p.duties[request.service] = status;
  else state.support[id].status = status;
  staffAction.close();
  render(true);
  announce(status === 'configured' ? 'Verifica dimostrativa registrata.' : 'Richiesta di prova presa in carico.');
});

const command = document.querySelector('#command');
const commandState = {opener:null, items:[], index:0};
const normalized = text => text.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLocaleLowerCase('it');
function commandOptions() {
  const action = (label, detail, route, symbol = 'arrow') => ({group:'Azioni',label,detail,route,symbol});
  if (isStaff(where().view)) return [
    action('Richieste di aiuto','Console staff · Supporto','staff','wrench'),
    action('Processi','Console staff · Sistema','processi','settings'),
    action('Preparazione strutture','Processi · Lotto Quokka360','lotto','layers'),
    ...staffRequests().map(request => ({
      group:'Richieste',label:request.type === 'duty' ? services[request.service].name : request.label,
      detail:request.p.name,route:'richiesta/' + request.id,symbol:'file'
    }))
  ];
  return [
    action('Attivazione','Immobili · Fasi di attivazione','attivazione','home'),
    action('Canali e calendari','Immobili · Collegamenti','canali','link'),
    action('Collega un portale','Booking.com, Airbnb, Vrbo, Expedia','portali','link'),
    action('Revisione annunci','Immobili · Dati da confermare','revisione','file'),
    action('Prezzi e provenienza','Lario Suite Brienno','prezzi/lario','credit'),
    ...properties.map(p => ({group:'Immobili',label:p.name,detail:p.place,route:'immobile/' + p.id,symbol:'home'}))
  ];
}
function setCommandIndex(index, scroll = false) {
  const total = commandState.items.length;
  const options = [...command.querySelectorAll('[role="option"]')];
  const input = command.querySelector('#command-query');
  commandState.index = total ? (index + total) % total : 0;
  options.forEach((option,i) => option.setAttribute('aria-selected',String(i === commandState.index)));
  if (total) {
    const active = options[commandState.index];
    input.setAttribute('aria-activedescendant',active.id);
    if (scroll) active.scrollIntoView({block:'nearest'});
  } else input.removeAttribute('aria-activedescendant');
}
function filterCommands(text) {
  const terms = normalized(text).trim().split(/\s+/).filter(Boolean);
  commandState.items = commandOptions().filter(item => {
    const match = normalized([item.group,item.label,item.detail].join(' '));
    return terms.every(v => match.includes(v));
  });
  const groups = [...new Set(commandState.items.map(item => item.group))];
  const result = command.querySelector('#command-results');
  result.innerHTML = groups.length ? groups.map((group,groupIndex) => '<li role="presentation"><p class="command-group" id="command-group-' + groupIndex + '">' + group + '</p><ul role="group" aria-labelledby="command-group-' + groupIndex + '">' +
    commandState.items.map((item,index) => item.group === group ? '<li role="option" id="command-item-' + index + '" data-command-index="' + index + '" aria-selected="false">' +
      icon(item.symbol,'small') + '<span><strong>' + e(item.label) + '</strong><small>' + e(item.detail) + '</small></span>' + icon('next','small') + '</li>' : '').join('') + '</ul></li>').join('') :
    '<li role="presentation" class="empty">Nessun risultato. Prova il nome di un immobile o di un’azione.</li>';
  command.querySelector('#command-count').textContent = commandState.items.length + (commandState.items.length === 1 ? ' risultato' : ' risultati');
  setCommandIndex(0);
}
function openCommand(opener) {
  if (dialog.open || command.open) return;
  commandState.opener = opener;
  command.innerHTML = '<div class="command-inner"><h2 class="sr" id="command-title">Cerca in CasaZen</h2><div class="command-head">' + icon('search') +
    '<label class="sr" for="command-query">Cerca immobili e azioni</label><input id="command-query" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="command-results" placeholder="Cerca immobili e azioni…" autofocus>' +
    '<button type="button" class="quiet" data-command-close>Chiudi</button></div><ul role="listbox" aria-label="Risultati della ricerca" id="command-results"></ul>' +
    '<p class="command-foot"><span>↑ ↓ Seleziona</span><span>↵ Apri</span></p><p id="command-count" class="sr" role="status"></p></div>';
  filterCommands('');
  command.showModal();
  command.querySelector('#command-query').focus();
}
function chooseCommand(index) {
  const selected = commandState.items[index];
  if (!selected) return;
  command.close();
  go(selected.route);
}
command.addEventListener('input', event => {
  if (event.target.id === 'command-query') filterCommands(event.target.value);
});
command.addEventListener('keydown', event => {
  if (event.target.id !== 'command-query' || event.isComposing) return;
  let next;
  switch (event.key) {
    case 'Escape': event.preventDefault(); command.close(); return;
    case 'ArrowDown': next = commandState.index + 1; break;
    case 'ArrowUp': next = commandState.index - 1; break;
    case 'Enter': event.preventDefault(); chooseCommand(commandState.index); return;
    default: return;
  }
  event.preventDefault();
  setCommandIndex(next,true);
});
command.addEventListener('click',event => {
  const item = event.target.closest('[data-command-index]');
  if (item) chooseCommand(Number(item.dataset.commandIndex));
  if (event.target.closest('[data-command-close]')) command.close();
});
command.addEventListener('close', () => {
  if (commandState.opener?.isConnected) commandState.opener.focus();
  commandState.opener = null;
});
function refreshPhase(value) {
  state.filter = value;
  const phases = app.querySelector('.roadmap');
  if (phases) phases.dataset.phase = value;
  const queueFilter = app.querySelector('#queue-filter');
  if (queueFilter) queueFilter.value = value;
  app.querySelectorAll('.roadmap a').forEach(tab => {
    if (tab.dataset.value === state.filter) tab.setAttribute('aria-current','true');
    else tab.removeAttribute('aria-current');
  });
  updateQueue();
}

window.addEventListener('keydown',event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k' && !event.altKey && !dialog.open && !command.open && !staffAction.open) {
    event.preventDefault();
    openCommand(document.activeElement instanceof HTMLElement ? document.activeElement : app.querySelector('.global-search'));
  }
  if (event.key === 'Escape') {
    const menu = app.querySelector('#mobile-more');
    const toggle = app.querySelector('[data-action="more"]');
    if (menu && !menu.hidden) {
      menu.hidden = true;
      toggle?.setAttribute('aria-expanded','false');
      toggle?.focus();
    }
  }
});
window.addEventListener('hashchange', () => {
  if (dialog.open) dialog.close();
  if (command.open) command.close();
  if (staffAction.open) staffAction.close();
  render(true);
  const route = where();
  window.scrollTo(0,route.view === 'attivazione' && matchMedia('(max-width:767px)').matches ? state.queueScroll : 0);
});
render();
</script>
</body>
</html>
