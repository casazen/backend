:root {
  color-scheme: light;
  --surface: var(--stone-0); --background: var(--stone-25); --soft: var(--stone-50);
  --text: var(--ink-700); --muted: var(--stone-600); --line: var(--stone-200);
  --focus: var(--blue-solid); --accent: var(--terra-600); --deep: var(--terra-800);
  --tint: var(--terra-100); --tint-light: var(--terra-50); --tint-line: var(--terra-200);
  --font: Inter, system-ui, sans-serif; --round: 20px;
}
[data-area="staff"], .staff-tone {
  --accent: var(--ametista-600); --deep: var(--ametista-800);
  --tint: var(--ametista-100); --tint-light: var(--ametista-50); --tint-line: var(--ametista-200);
}
*, *::before, *::after { box-sizing: border-box }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--background); font-size: 15px; line-height: 1.5 }
h1,h2,h3,p,ul,ol,figure { margin: 0 }
h1,h2,h3 { line-height: 1.12; letter-spacing: -.035em }
h1 { font-size: clamp(34px,4.2vw,61px); font-weight: 720; overflow-wrap: anywhere }
#page-title:focus { outline: none }
h2 { font-size: 23px; font-weight: 700 }
h3 { font-size: 18px; font-weight: 680 }
ul,ol { padding: 0; list-style: none }
p { overflow-wrap: anywhere }
button,input,textarea,select { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit; text-decoration: none }
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px }
[hidden] { display: none !important }
.sr,.skip:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.skip:focus { position: fixed; top: 8px; left: 8px; z-index: 20; background: var(--surface); padding: 12px }
.icon { flex-shrink: 0; display: inline-block; width: 18px; height: 18px; vertical-align: middle }
.logo { display: inline-flex; align-items: center; gap: 9px; font-weight: 750; font-size: 23px; letter-spacing: -.055em; min-height: 44px }
.logo img { width: 27px; height: 27px }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; padding: 10px 14px; font-size: 13px; font-weight: 660; border-radius: 10px; border: 1px solid var(--line); color: var(--text); background: var(--surface); text-align: center; line-height: 1.25 }
.btn:hover { border-color: var(--tint-line); background: var(--tint-light) }
.btn.primary { color: var(--surface); background: var(--accent); border-color: var(--accent) }
.btn.primary:hover { background: var(--deep); border-color: var(--deep) }
.btn.help { border-color: var(--blue-border); color: var(--blue-text) }
.btn.simulation { border-style: dashed }
.btn.back { padding: 9px 0; border-color: transparent; background: transparent; justify-content: flex-start }
.btn.back:hover { color: var(--deep) }
.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; border-radius: 100px; padding: 3px 9px; font-size: 11px; font-weight: 670; line-height: 1.35; text-align: left; background: var(--stone-100); color: var(--stone-700) }
.tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0 }
.tag.blue { background: var(--blue-bg); color: var(--blue-text) }
.tag.green { background: var(--green-bg); color: var(--green-text) }
.tag.amber { background: var(--amber-bg); color: var(--amber-text) }
.tag.red { background: var(--red-bg); color: var(--red-text) }
.kicker { color: var(--deep); font-size: 12px; font-weight: 710; letter-spacing: .025em }
.muted { color: var(--muted) }
.lead { font-size: 16px; max-width: 68ch; color: var(--muted); margin-top: 12px }
.inline-end { display: flex; align-items: center; flex-wrap: wrap; gap: 8px }
.rail { position: fixed; inset: 0 auto 0 0; width: 240px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 19px 15px 10px; overflow: auto; z-index: 8 }
.rail > .logo { padding-left: 10px; align-self: flex-start }
.area { margin: 18px 0 11px; background: var(--tint-light); border: 1px solid var(--tint-line); border-radius: 13px; display: flex; gap: 11px; align-items: center; padding: 10px; font-size: 13px }
.area-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--tint); color: var(--deep) }
.area small { display: block; color: var(--muted); margin-top: 1px }
.navgroup { padding-top: 12px }
.navgroup p { color: var(--muted); font-size: 11px; font-weight: 690; padding: 2px 10px }
.navitem { min-height: 35px; padding: 7px 10px; display: flex; align-items: center; gap: 9px; border-radius: 8px; font-size: 13px }
a.navitem { min-height: 44px }
span.navitem { color: var(--muted) }
a.navitem:hover,.navitem[aria-current] { background: var(--tint); color: var(--deep); font-weight: 650 }
.rail-foot { border-top: 1px solid var(--line); margin-top: auto; padding-top: 10px }
.frame { margin-left: 240px; min-width: 0 }
.topbar { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 8px; padding: 9px clamp(16px,3vw,38px); align-items: center }
.topbar .search-open { justify-content: flex-start; min-width: 0; flex: 1; max-width: 440px; margin-right: auto; color: var(--muted) }
.mobile-logo,.dock { display: none }
.area-badge { white-space: nowrap; color: var(--muted); font-size: 13px; font-weight: 620; padding-left: 8px }
.workspace { width: min(100%,1370px); margin: auto; padding: 24px clamp(20px,4vw,56px) 56px }
.scene-hero { position: relative; isolation: isolate; padding: clamp(20px,3.4vw,42px); background: linear-gradient(113deg,var(--surface) 24%,var(--tint-light) 78%,var(--tint)); border: 1px solid var(--tint-line); border-radius: 24px; overflow: hidden }
.scene-hero::after { content: ''; z-index: -1; position: absolute; right: -90px; top: -150px; width: 360px; height: 310px; border: 1px solid var(--tint-line); border-radius: 45%; box-shadow: 0 0 0 22px var(--tint-light), 0 0 0 44px var(--tint-line); opacity: .65; pointer-events: none }
.hero-top { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px }
.scene-hero .lead { color: var(--text); opacity: .94 }
.scene-hero h1 { max-width: 22ch }
.scene-hero .action-row { margin-top: 22px }
.scene-hero .action-row .btn { align-self: start }
.section-tabs { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 16px; border-bottom: 1px solid var(--line) }
.section-tabs > * { position: relative; padding: 10px 8px; border-bottom: 2px solid transparent; min-height: 44px; color: var(--muted); font-size: 13px }
.section-tabs [aria-current] { color: var(--deep); border-color: var(--accent); font-weight: 700 }
.control.section-mobile { display: none }
.scene-layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(224px,28%); gap: 16px; align-items: start; margin-top: 16px }
.content-stack,.right { display: grid; gap: 14px; min-width: 0 }
.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--round); padding: 21px }
.card h2+p,.card h3+p { margin-top: 7px }
.card p,.row-copy small { color: var(--muted); font-size: 13px }
.card ul { margin-top: 12px }
.record { min-width: 0; display: grid; grid-template-columns: minmax(125px,1fr) auto auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 10px 0 }
.record:last-child { padding-bottom: 0 }
.row-copy { min-width: 0; display: flex; align-items: flex-start; gap: 10px; font-size: 14px }
.row-copy > span:last-child { overflow-wrap: anywhere }
.row-copy small { display: block; margin-top: 2px }
.monogram { display: grid; place-items: center; flex: 0 0 34px; height: 34px; border-radius: 9px; background: var(--tint-light); color: var(--deep); font-size: 10px; font-weight: 740 }
.record .btn { font-size: 12px }
.right .card { padding: 17px }
.right .card + .card { margin-top: 0 }
.help-card { border-color: var(--blue-border); background: var(--blue-bg) }
.help-card .kicker,.help-card h2 { color: var(--blue-text) }
.help-card h2 { font-size: 17px; margin: 8px 0 }
.help-card .btn { margin-top: 11px }
.step-card h2 { font-size: 16px; letter-spacing: -.02em }
.stepper { display: grid; margin-top: 11px }
.stepper li { position: relative; display: grid; grid-template-columns: 23px 1fr; font-size: 12px; align-items: start; gap: 8px; padding: 7px 0; color: var(--muted) }
.stepper li:not(:last-child)::after { content: ''; position: absolute; background: var(--line); top: 29px; bottom: -7px; width: 1px; left: 11px }
.stepper .stepdot { display: grid; place-items: center; height: 23px; width: 23px; color: var(--stone-700); background: var(--stone-100); border-radius: 20px; font-size: 10px; font-weight: 700; z-index: 1 }
.stepper [aria-current] .stepdot { background: var(--tint); color: var(--deep); box-shadow: inset 0 0 0 1px var(--tint-line) }
.stepper [aria-current] { color: var(--deep); font-weight: 700 }
.stepper .done .stepdot { background: var(--green-bg); color: var(--green-text) }
.step-label { padding-top: 2px }
.action-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.controls { display: grid; gap: 15px }
.control,.choice-set { display: grid; gap: 6px; font-size: 14px; font-weight: 650; min-width: 0 }
.choice-set { border: 0; padding: 0; margin: 0 }
.choice-set legend { margin-bottom: 6px; padding: 0 }
.control small,.choice-set small { color: var(--muted); font-weight: 400 }
.control input,.control select,.control textarea,.filter input,.filter select,#quick input { width: 100%; min-height: 46px; border: 1px solid var(--stone-400); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-weight: 440 }
.control textarea { resize: vertical; min-height: 96px }
.control [aria-invalid] { border-color: var(--red-text) }
.error,.control small.error,.choice-set small.error { color: var(--red-text); font-weight: 620 }
.choice { display: flex; align-items: center; gap: 10px; padding: 11px 13px; min-height: 50px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); cursor: pointer }
.choice:has(input:checked) { background: var(--tint-light); border-color: var(--tint-line); color: var(--deep) }
.choice input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: 0 0 18px }
.form-actions { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px }
.filter { display: grid; grid-template-columns: 1fr minmax(140px,.4fr); gap: 10px; align-items: end }
.filter label { display: grid; gap: 5px; font-size: 12px; font-weight: 650; min-width: 0 }
.empty { text-align: center; padding: 13px; color: var(--muted) }
.map-top { border-bottom: 1px solid var(--line); background: var(--surface) }
.map-nav { display: flex; gap: 10px; align-items: center; padding: 10px clamp(16px,5vw,64px); width: min(100%,1350px); margin: auto }
.map-nav .logo { margin-right: auto }
.map { max-width: 1350px; padding: clamp(18px,4vw,55px); margin: 0 auto }
.map-intro { border-radius: 30px; padding: clamp(23px,5vw,60px); min-height: 255px }
.map-intro h1 { max-width: 16ch; font-size: clamp(38px,6vw,76px) }
.map-intro .lead { max-width: 54ch; font-size: 17px }
.path-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; margin: 18px 0 25px }
.path { display: flex; flex-direction: column; align-items: stretch; gap: 11px; border-top: 3px solid var(--accent); transition: border-color var(--dur-fast), background var(--dur-base) }
.path:hover { background: var(--tint-light) }
.path h2 { font-size: 22px }
.path p { margin-top: 0 }
.path .kicker { color: var(--deep) }
.path .action-row { margin-top: auto; padding-top: 7px }
.map-section { margin-top: 24px }
.map-section > h2 { margin-bottom: 11px }
.trace-layout { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(230px,.8fr); gap: 15px; margin-top: 16px; align-items: start }
.trace-card { display: grid; grid-template-columns: 27px minmax(0,1fr) 20px; align-items: start; gap: 10px; min-height: 46px; padding: 9px 0; border-top: 1px solid var(--line) }
.trace-card:hover strong { color: var(--deep); text-decoration: underline }
.trace-card .stepdot { display: grid; place-items: center; height: 25px; width: 25px; border-radius: 13px; background: var(--tint); color: var(--deep); font-size: 11px; font-weight: 650 }
.trace-card small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px }
.trace-card .icon { margin-top: 3px; color: var(--deep) }
.decision { padding: 8px 0 8px 36px; border-top: 1px solid var(--line) }
.decision summary { min-height: 35px; align-content: center; cursor: pointer; color: var(--deep); font-size: 13px; font-weight: 660 }
.decision > ul { margin-top: 3px }
.decision .trace-card { grid-template-columns: minmax(0,1fr) 20px }
.event-list { display: grid; gap: 0; padding: 3px 0 }
.event-list li { display: grid; grid-template-columns: minmax(155px,.65fr) minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.event-list li:first-child { border-top: 0 }
.event-list small { display: block; color: var(--muted) }
dialog { color: var(--text); border: 1px solid var(--line); padding: 22px; border-radius: 20px; width: min(535px,calc(100vw - 30px)); max-height: min(650px,calc(100dvh - 32px)); background: var(--surface); box-shadow: 0 24px 80px #1f3a3d33 }
dialog::backdrop { background: #1f3a3d45 }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px }
dialog ul { display: grid; gap: 5px; margin-top: 14px }
dialog p { margin: 7px 0 12px }
dialog .btn { justify-content: flex-start }
@media (max-width: 1080px) {
  .rail { width: 199px }
  .frame { margin-left: 199px }
  .scene-layout { grid-template-columns: minmax(0,1fr) minmax(170px,27%) }
  .record { grid-template-columns: minmax(0,1fr) auto }
  .record .btn { grid-column: 2 }
}
@media (max-width: 790px) {
  .rail { display: none }
  .frame { margin-left: 0 }
  .topbar { padding: 7px 14px; gap: 6px }
  .mobile-logo { display: inline-flex; margin-right: auto }
  .topbar .search-open { flex: none; min-width: 44px; padding: 0; justify-content: center; margin: 0 }
  .topbar .search-open span,.topbar .area-badge,.topbar .guide { display: none }
  .dock { position: fixed; inset: auto 0 0; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); background: var(--surface); border-top: 1px solid var(--line); z-index: 8; padding: 3px 4px max(4px,env(safe-area-inset-bottom)); text-align: center }
  .dock a { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 49px; font-size: 10px; border-radius: 8px }
  .dock a[aria-current] { background: var(--tint); color: var(--deep); font-weight: 700 }
  .workspace { padding-bottom: 85px }
  .path-grid { grid-template-columns: repeat(2,minmax(0,1fr)) }
}
@media (max-width: 575px) {
  .workspace { padding: 10px 13px 82px }
  .scene-layout,.trace-layout,.path-grid { grid-template-columns: minmax(0,1fr) }
  .scene-hero { border-radius: 19px }
  .scene-hero::after { right: -198px; top: -170px }
  .lead { font-size: 14px }
  .card { padding: 15px }
  .scene-hero .action-row .primary,.form-actions .primary { width: 100% }
  .record { grid-template-columns: minmax(0,1fr) auto }
  .record .btn { grid-column: 1 / -1; justify-self: start }
  .topbar .btn.help { font-size: 11px; padding: 8px }
  .filter { grid-template-columns: minmax(0,1fr) }
  .section-tabs { display: none }
  .control.section-mobile { display: grid; margin-bottom: 12px }
  .event-list li { grid-template-columns: minmax(0,1fr) auto }
  .event-list li > p { grid-column: 1 / -1; grid-row: 2 }
  .map-nav .btn { font-size: 11px; padding: 8px }
  .map-intro { border-radius: 20px }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { transition-duration: 0ms !important; animation-duration: 0ms !important; scroll-behavior: auto !important }
}

function restore() {
  try {
    Object.assign(state, JSON.parse(sessionStorage.getItem(resetStorage) || '{}'));
    if (!Array.isArray(state.published)) state.published=[];
    if (!Array.isArray(state.prepared)) state.prepared=[];
    if (state.request) state.request=state.requests.find(r=>r.id===state.request.id)||state.request;
  } catch {}
}
function persist() {
  try {
    const {fields, ...progress} = state;
    const request = progress.request && {...progress.request,note:''};
    const requests = progress.requests.map(report=>({...report,note:''}));
    sessionStorage.setItem(resetStorage,JSON.stringify({...progress,request,requests}));
  } catch {}
}

      const closed=request.status==='verified';
      scene.cards[closed?2:ongoing?1:0].rows.unshift(row(request.service,request.property+' · '+request.id,request.status==='needs'?'Attende l’host':closed?'Verificato':ongoing?'In corso':'Da prendere in carico',closed?'green':ongoing?'blue':'amber',action('Apri '+request.id,'staff-request','secondary',{requestId:request.id})));
    }
  }
  return scene;
}
function searchFilter(scene) {
  const label = scene.id==='portal-catalog'?'Cerca un portale':scene.id==='staff-queue'?'Cerca una richiesta':'Cerca un immobile';
  return '<section class="card filter"><label>' + label + '<input id="scene-search" type="search" placeholder="Nome o stato"></label><label>Stato<select id="scene-status"><option value="">Tutti</option><option value="amber">Richiede attenzione</option><option value="blue">In corso o da collegare</option><option value="green">Verificato</option><option value="gray">Altri stati</option></select></label></section><p class="empty" id="no-rows" hidden>Nessun risultato. Cambia i filtri.</p>';
}
function renderScene(input) {
  const scene=refine(input);
  currentScene=scene;
  const {sidebar,header,dock} = chrome(scene);
  const shortAction = !scene.fields;
  const heading = '<section class="scene-hero"><div class="hero-top"><p class="kicker">' + escape(scene.context || stages[scene.lane]) + '</p>' +
    (scene.status?pill(...scene.status):'') + '</div><h1 id="page-title" tabindex="-1">' + escape(scene.title) + '</h1><p class="lead">' + escape(scene.lead) + '</p>' +
    (shortAction?'<div class="action-row">' + ((scene.actions || []).map(a=>act(a)).join('')) + '</div>':'') + '</section>';
  app.innerHTML = sidebar + '<div class="frame">' + header + '<main class="workspace" id="main" aria-labelledby="page-title">' +
    (scene.back?link('Indietro',href(scene.back),'back','left'):'') + tabs(scene) + heading + '<div class="scene-layout"><div class="content-stack">' +
    (scene.search?searchFilter(scene):'') + (scene.cards||[]).map(renderCard).join('') + (scene.fields?form(scene):'') +
    '</div><aside class="right" aria-label="Avanzamento e aiuto">' + sideHelp(scene) + tracker(scene) + '</aside></div></main></div>' + dock;
  if (scene.search && state.filters[scene.id]) {
    document.querySelector('#scene-search').value=state.filters[scene.id].query;
    document.querySelector('#scene-status').value=state.filters[scene.id].tone;
    filterRows();
  }
}
function mapHeader() {
  return '<header class="map-top"><div class="map-nav">' + logo() + link('Apri Short Rent',href('short-home',null),'secondary','home') +
    link('Apri Super Admin',href('staff-home',null),'secondary','settings') + '</div></header>';
}
function renderMap() {
  const items = paths.map((p,i) => '<article class="card path' + (p.id==='prepare'?' staff-tone':'') + '"><p class="kicker">' + escape(p.actor) + '</p><h2>' +
    escape(p.title) + '</h2><p><strong>Ingresso</strong> · ' + escape(byId[p.entry].title) + '</p><p>' + escape(p.outcome) + '</p><div class="action-row">' +
    '<button type="button" class="btn primary" data-start="' + p.id + '">Prova il percorso' + icon('arrow') + '</button>' +
    link('Vedi i passaggi','#traccia/'+p.id) + '</div></article>').join('');
  const events = manualEvents.map(([title,actor,detail,from,to]) => '<li><div><strong>' + escape(title) + '</strong><small>' + escape(actor) +
    '</small></div><p>' + escape(detail) + '</p>' + link('Vedi il passaggio',href(to,null),'secondary','arrow') + '</li>').join('');
  app.innerHTML=mapHeader()+'<main class="map" id="main" aria-labelledby="page-title"><section class="scene-hero map-intro"><div class="hero-top"><p class="kicker">Prototipo interattivo · CasaZen #1026</p></div><h1 tabindex="-1" id="page-title">Attivazione immobili</h1><p class="lead">Segui i passaggi di host, PM e staff. Prova le decisioni, le attese e la ripresa dal punto in cui il lavoro si è fermato.</p></section>' +
    '<section class="map-section"><h2>Percorsi da provare</h2><div class="path-grid">' + items + '</div></section><section class="map-section"><h2>Passaggi tra host, staff e portali</h2><div class="card"><ol class="event-list">'+events+
    '</ol></div></section><div class="action-row map-section"><button class="btn secondary" type="button" data-reset>Reimposta la simulazione</button></div></main>';
}
function traceRow(id,number,path) {
  const target = byId[id];
  return '<a class="trace-card" href="' + href(id,path) + '"><span class="stepdot" aria-hidden="true">' + (number || '↳') +
    '</span><span><strong>' + escape(target.title) + '</strong><small>' + escape(target.lead) + '</small></span>' + icon('arrow') + '</a>';
}
function decisions(id,path) {
  const scene=byId[id];
  const routes=[...(scene.actions||[]),...(scene.cards||[]).flatMap(c=>c.rows.map(r=>r.link).filter(Boolean))];
  const exits=routes.flatMap(a=>[a,...(a.when?[{label:'Se scegli '+a.when.is,to:a.when.to}]:[])]);
  if (scene.id==='host-activation') exits.push({label:'Apri Adempimenti',to:'duty-entry'});
  if (scene.back) exits.push({label:'Indietro',to:scene.back});
  if (!exits.length) return '';
  return '<details class="decision"><summary>Azioni e destinazioni</summary><ul>' + exits.map(a=>
    '<li><a class="trace-card" href="' + href(a.to,path) + '"><span><strong>' + escape(a.label) + '</strong><small>Vai a ' + escape(byId[a.to].title) + '</small></span>' + icon('arrow') + '</a></li>').join('') + '</ul></details>';
}
function renderTrace(path) {
  app.innerHTML=mapHeader()+'<main class="map" id="main" aria-labelledby="page-title">' + link('Torna alla mappa','#mappa','back','left') +
    '<section class="scene-hero"><div class="hero-top"><p class="kicker">' + escape(path.actor) + '</p></div><h1 id="page-title" tabindex="-1">' + escape(path.title) + '</h1><p class="lead">' + escape(path.outcome) +
    '</p><div class="action-row"><button class="btn primary" type="button" data-start="' + path.id + '">Inizia da ' + escape(byId[path.entry].title) + icon('arrow') + '</button></div></section>' +
    '<div class="trace-layout"><section class="card"><h2>Sequenza principale</h2><ul>' + path.steps.map((id,i) => '<li>' + traceRow(id,i+1,path.id) + decisions(id,path.id) + '</li>').join('') +
    '</ul></section><section class="card"><h2>Varianti e recupero</h2><ul>' + path.variants.map(id => '<li>' + traceRow(id,0,path.id) + '</li>').join('') + '</ul></section></div></main>';
}
function navigate(id,path=active.path) {
  const next=href(id,path);
  if (location.hash===next) render();
  else location.hash=next;
}
function render() {
  if (dialog.open) dialog.close();
  const [type,id,path]=decodeURIComponent(location.hash.slice(1)).split('/');
  currentActions=[];
  currentScene=null;
  if (type==='v'&&byId[id]) {
    active={id,path:byPath[path]?path:undefined};
    const scene=byId[id];
    document.documentElement.dataset.area=scene.actor==='staff'?'staff':'short';
    renderScene(scene);
  } else if (type==='traccia'&&byPath[id]) {
    active={id:'traccia',path:id};
    document.documentElement.dataset.area=id==='prepare'?'staff':'short';
    renderTrace(byPath[id]);
  } else {
    active={id:'mappa'};
    document.documentElement.dataset.area='short';
    renderMap();
  }
  document.title='CasaZen · ' + (currentScene?.title || byPath[active.path]?.title || 'Mappa dei percorsi');
  const title = document.querySelector('#page-title');
  if (!initial) {
    window.scrollTo(0,0);
    title?.focus({preventScroll:true});
  }
  initial=false;
}
function rememberDraft(el) {
  const scene=currentScene;
  const form=el.closest('#scene-form');
  if (!form || !scene || el.type==='password') return;
  const entries=state.fields[scene.id] ||= {};
  const codeGroup=el.closest('[data-unit-group]');
  if (codeGroup) {
    (entries[codeGroup.dataset.unitGroup] ||= {})[el.dataset.code]=el.value;
    return;
  }
  entries[el.name]=el.type==='checkbox'?Array.from(form.querySelectorAll('input[name="' + el.name + '"]:checked'),i=>i.value):el.value;
  if (el.type==='checkbox') {
    for (const field of scene.fields.filter(f=>f.source===el.name)) {
      const group=form.querySelector('[data-unit-group="' + field.id + '"] .controls');
      group.innerHTML=renderCodes(scene,field);
    }
  }
}
function filterRows() {
  const search = document.querySelector('#scene-search');
  if (!search) return;
  const phrase = search.value.trim().toLocaleLowerCase('it');
  const tone = document.querySelector('#scene-status').value;
  state.filters[active.id]={query:search.value,tone};
  const all=Array.from(document.querySelectorAll('[data-find]'));
  all.forEach(r=>{r.hidden=!(r.dataset.find.includes(phrase)&&(!tone || r.dataset.tone===tone));});
  if (all.length) document.querySelector('#no-rows').hidden=all.some(r=>!r.hidden);
}
function validate() {
  const form = document.querySelector('#scene-form');
  if (!form) return true;
  form.querySelectorAll('.error').forEach(e=>e.remove());
  form.querySelectorAll('[aria-invalid]').forEach(input=>{
    input.removeAttribute('aria-invalid');
    if (input.getAttribute('aria-describedby')?.includes('-error')) input.removeAttribute('aria-describedby');
  });
  let first;
  for (const field of visibleFields(currentScene)) {
    const id=field.id;
    const controls = field.kind==='unitCodes'?Array.from(form.querySelectorAll('[data-unit-group="' + id + '"] input')):
      Array.from(form.querySelectorAll('[name="' + id + '"]'));
    const choice = ['radio','checks'].includes(field.kind);
    const invalid = choice ? (field.required && !controls.some(input=>input.checked)?[controls[0]]:[]) :
      controls.filter(input=>!input.validity.valid || field.required&&!input.value.trim() || field.format==='https'&&!/^https:\/\/[^\s/]+\/\S+$/.test(input.value));
    for (const input of invalid.filter(Boolean)) {
      const container = input.closest('.control,.choice-set');
      const error = document.createElement('small');
      error.className='error';
      error.id=input.id+'-error';
      error.textContent = field.format==='https'?'Inserisci un URL HTTPS di prova.':choice?
        (field.kind==='checks'?'Seleziona almeno un immobile.':'Seleziona un’opzione.') :
        field.kind==='number'?'Inserisci un importo maggiore di zero.':'Completa questo campo.';
      container.append(error);
      input.setAttribute('aria-invalid','true');
      input.setAttribute('aria-describedby',error.id);
      first ||= input;
    }
  }
  if (first) {
    first.focus();
    announcement.textContent='Controlla i campi evidenziati.';
  }
  return !first;
}
function updateState(scene,to,item) {
  if (item.requestId) state.request=state.requests.find(r=>r.id===item.requestId)||state.request;
  if (item.provider) state.channel=item.provider;
  if (item.service) state.service=item.service;
  if (item.property) state.property=item.property;
  if (item.scope) state.scope=item.scope;
  if (item.importResult) state.importChecked=true;
  if (scene.id==='host-bulk'&&to==='portal-catalog') state.selectedUnits.bulk=state.fields[scene.id]?.['bulk-units'] || [];
  if (to==='review-confirm') {
    state.reviewBack=scene.id;
    state.property=scene.id==='review-cin'?'Romantic Chic Apartment':'Prestige du Lac 07';
  }
  if (to==='review-published'&&!state.published.includes(state.property)) state.published.push(state.property);
  if (to==='staff-confirm') state.selectedUnits.batch=state.fields[scene.id]?.[scene.fields[0].id] || [];
  if (to==='staff-ready') state.prepared=Array.from(new Set([...state.prepared,...(state.selectedUnits.batch || ['Lario Suite Brienno']).filter(p=>p==='Lario Suite Brienno'||state.published.includes(p))]));
  if (to==='review-original'&&item.validate) state.price=state.fields[scene.id]?.price || '70.83';
  if (to==='duty-services'&&scene.id==='duty-no-portals') state.noPortals=true;
  if (to==='duty-services'&&scene.id==='duty-entry'&&!item.property) state.property='Varenna Wonders';
  if (to==='host-ical-done') state.ical=true;
  if (to==='portal-vrbo-result') state.vrbo=state.fields['portal-vrbo-units']?.['vrbo-units'] || [];
  if (scene.id==='portal-vrbo-result'&&to==='portal-mapping-risk') {state.property='Varenna Wonders';state.channel='Vrbo';}
  if (item.to==='portal-airbnb' && scene.id!=='portal-booking') state.channel='Airbnb';
  if (scene.id==='portal-catalog'&&to==='portal-booking') state.channel='Booking.com';
  if (/^portal-(wait|expired|rooms|mapping|reservations|calendar|mark|partial|synced|revoked)/.test(to)) setConnection(state.property,state.channel,to);
  if (to==='assist-why' && scene.id!=='assist-preview') state.fromScene=scene.id;
  if (to==='assist-preview' && scene.id!=='assist-why') state.fromScene=scene.id;
  if (to==='assist-sent'||scene.id==='duty-review'&&to==='duty-sent') {
    const info = contextual(byId[state.fromScene] || scene);
    const property=scene.id==='duty-review'?(state.property||'Varenna Wonders'):info.property;
    const service=scene.id==='duty-review'?(state.service||'Alloggiati'):state.service || info.service;
    let request=state.requests.find(r=>r.property===property&&r.service===service&&r.status!=='verified');
    if (!request) {
      request={id:'CZ-1026-'+String(5+state.requests.length).padStart(2,'0'),property,service,status:'new',note:''};
      state.requests.push(request);
    }
    state.request=request;
  }
  if (['duty-need','staff-auto-check','host-request-needs'].includes(to)&&!state.request) {
    state.request={id:'CZ-1026-05',property:'Varenna Wonders',service:state.service||'Alloggiati',status:'needs',note:''};
    state.requests.push(state.request);
  }
  if (['duty-need','staff-auto-check','host-request-needs'].includes(to)&&state.request&&state.request.status!=='verified') state.request.status='needs';
  if (scene.id==='staff-take'&&['staff-vault','staff-portal-work'].includes(to)&&state.request) state.request.status='working';
  if (to==='duty-corrected'&&state.request) state.request.status='corrected';
  if (to==='staff-followup'&&state.request) state.request.status='followup';
  if ((to==='staff-closed'||scene.id==='duty-corrected'&&to==='duty-verified')&&state.request) {
    state.request.status='verified';
    state.request.note=state.fields[scene.id]?.['close-note'] || 'Riscontro verificato per il servizio associato.';
  }
}
function execute(item) {
  if (!item || !currentScene) return;
  if (item.validate&&!validate()) return;
  if (item.stay) {announcement.textContent='Lo stato è ancora in attesa. Puoi proseguire con altri immobili.';return;}
  const scene = currentScene;
  const when = item.when;
  const to = when&&setting(when.id)===when.is?when.to:item.to;
  updateState(scene,to,item);
  persist();
  navigate(to);
}
function start(pathId) {
  const path=byPath[pathId];
  if (!path) return;
  if (pathId==='handoff') {
    state.fromScene='duty-services';state.service='Alloggiati';state.property='Varenna Wonders';
  } else if (['one-channel','account'].includes(pathId)) {
    state.property='Lario Suite Brienno';state.channel='Airbnb';
  } else if (pathId==='compliance') {
    state.property='Varenna Wonders';state.service='Alloggiati';
  }
  persist();
  navigate(path.entry,pathId);
}
function searchResults() {
  const query=dialog.querySelector('input');
  const search=query?.value.trim().toLocaleLowerCase('it') || '';
  const choices=(currentScene?.actor==='staff'?['staff-home','staff-process','staff-queue','staff-ready']:
    ['short-home','short-properties','short-channels','host-activation','review-list','property-lario','portal-catalog','duty-entry'])
    .map(id=>byId[id]).filter(s=>(s.title+' '+s.context+' '+s.lead).toLocaleLowerCase('it').includes(search));
  dialog.querySelector('#search-results').innerHTML=choices.length?choices.map(s=>'<li>'+link(s.title,href(s.id),'secondary','arrow')+'</li>').join(''):'<li>Nessun risultato.</li>';
}
function showDialog(type) {
  if (type==='help'&&!currentScene) return;
  const scene=currentScene;
  const copy = scene && contextual(scene);
  const heading=type==='search'?'Cerca nella sezione':'Chiedi a CasaZen';
  dialog.setAttribute('aria-labelledby','quick-title');
  const content=type==='search'?'<label class="control" for="quick-input"><span>Nome della pagina o dell’immobile</span><input type="search" id="quick-input" placeholder="Cerca" autofocus></label><ul id="search-results"></ul>':
    '<p>'+escape(copy.text)+'</p><p><strong>Fonte</strong> · '+escape(copy.source)+'</p><div class="action-row">'+
    act(action('Mostra il dettaglio','assist-why', 'secondary'))+act(action('Prepara “Fallo per me”','assist-preview','primary'))+'</div>';
  dialog.innerHTML='<div class="dialog-head"><h2 id="quick-title">'+heading+'</h2><button class="btn secondary" type="button" data-close aria-label="Chiudi">'+icon('close')+'</button></div>'+content;
  if (type==='search') searchResults();
  if (!dialog.open) dialog.showModal();
}
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-act],[data-dialog],[data-close],[data-reset],[data-start],#skip-link');
  if (!target) return;
  if (target.id==='skip-link') {event.preventDefault(); document.querySelector('#page-title')?.focus();}
  if (target.hasAttribute('data-close')) dialog.close();
  if (target.dataset.dialog) showDialog(target.dataset.dialog);
  if (target.dataset.act!==undefined) execute(currentActions[Number(target.dataset.act)]);
  if (target.dataset.start) start(target.dataset.start);
  if (target.hasAttribute('data-reset')) {state=defaultData();persist();render();announcement.textContent='Simulazione reimpostata.';}
});
document.addEventListener('input',event=>{
  const el=event.target;
  if (!(el instanceof HTMLInputElement || el instanceof HTMLSelectElement || el instanceof HTMLTextAreaElement)) return;
  if (el.id==='quick-input') searchResults();
  if (el.id==='scene-search'||el.id==='scene-status') filterRows();
  if (el.id==='section-tab'&&byId[el.value]) navigate(el.value);
  rememberDraft(el);
});
document.addEventListener('submit',event=>{
  if (event.target.id==='scene-form') {
    event.preventDefault();
    execute(currentScene.actions.find(a=>a.kind==='primary'));
  }
});
document.addEventListener('keydown',event=>{
  if ((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&currentScene) {event.preventDefault();showDialog('search');}
  if (event.key==='Enter'&&event.target.id==='quick-input') dialog.querySelector('#search-results a')?.click();
  if (dialog.open && ['ArrowDown','ArrowUp'].includes(event.key)) {
    const results=Array.from(dialog.querySelectorAll('#search-results a'));
    if (!results.length) return;
    event.preventDefault();
    const current=results.indexOf(document.activeElement);
    const next=current<0?0:(current+(event.key==='ArrowDown'?1:-1)+results.length)%results.length;
    results[next].focus();
  }
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
