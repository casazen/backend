openapi: 3.0.3
info:
  title: CasaZen - ConcordatoFacile integration
  version: 1.0-draft
  description: |
    Contratto tecnico di `01-technical-specification.md` (che prevale in caso di discrepanza).
    Tutti i nomi sono in inglese.

    - Tag `CasaZen`: l'endpoint che riceve gli eventi di ConcordatoFacile (sezioni 3 e 4).
    - Tag `ConcordatoFacile`: le chiamate che ConcordatoFacile espone (sezioni 1 e 5).

    Importi in centesimi interi; date ISO 8601 UTC; comune = codice ISTAT a 6 cifre.
tags:
  - name: CasaZen
  - name: ConcordatoFacile

paths:
  /webhooks/concordatofacile:
    servers:
      - url: '{casazenBaseUrl}'
        variables:
          casazenBaseUrl:
            default: https://test.example.invalid
            description: URL di prova e di produzione comunicati separatamente
    post:
      tags: [CasaZen]
      operationId: receiveEvent
      summary: Receives a case event from ConcordatoFacile
      description: |
        Risposta entro 3 secondi. Corpo massimo 256 KB.
        Firma: X-CF-Signature = "sha256=" + hex(HMAC-SHA256(secret, X-CF-Timestamp + "." + rawBody)).
        Orario ammesso: +/- 300 secondi. Idempotenza per X-CF-Event-Id.
        Ritentare solo su 408, 429, 5xx ed errori di rete (1 min, 5 min, 30 min, 2 h, 6 h, 12 h).
      parameters:
        - { name: X-CF-Event-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-CF-Timestamp, in: header, required: true, description: Secondi Unix UTC, schema: { type: integer, format: int64 } }
        - { name: X-CF-Key-Id, in: header, required: true, description: Identificativo del segreto, schema: { type: string } }
        - name: X-CF-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
        - { name: X-CF-Api-Version, in: header, required: true, schema: { type: string, enum: ['1'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
            examples:
              created:
                summary: Vettore di prova (secret test_secret_0123456789abcdef0123456789abcdef; timestamp 1760347800)
                value:
                  eventId: 7b0c1c5e-3a52-4d0e-9d3e-0a1f2b3c4d5e
                  eventType: case.created
                  apiVersion: '1'
                  occurredAt: '2026-10-13T09:30:00Z'
                  sequence: 1
                  caseId: CF-TEST-000001
                  reference: 0b6f7a3e-5a2d-4c58-9e0a-6c8b0f2e1d11
                  data:
                    level: complete
                    istatCode: '108039'
      responses:
        '200':
          description: Accettato (anche se già ricevuto)
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/NotRetryable' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '413': { $ref: '#/components/responses/NotRetryable' }
        '422': { $ref: '#/components/responses/UnknownReference' }
        '429': { $ref: '#/components/responses/Retryable' }
        '503': { $ref: '#/components/responses/Retryable' }

  /v1/cases:
    servers:
      - url: '{cfBaseUrl}'
        variables:
          cfBaseUrl:
            default: https://api.example.invalid
            description: URL API di ConcordatoFacile (prova e produzione)
    post:
      tags: [ConcordatoFacile]
      operationId: createCase
      summary: Creates a case with data and calculation already filled in (proposal)
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseCreated' }
        '401': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/cases/{caseId}/answers:
    servers:
      - url: '{cfBaseUrl}'
        variables:
          cfBaseUrl:
            default: https://api.example.invalid
    post:
      tags: [ConcordatoFacile]
      operationId: sendAnswers
      summary: Answers to an information request, or decision on the contract draft
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/InformationAnswers' }
                - { $ref: '#/components/schemas/DraftDecision' }
              discriminator:
                propertyName: type
                mapping:
                  information: '#/components/schemas/InformationAnswers'
                  draft_decision: '#/components/schemas/DraftDecision'
      responses:
        '202':
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, enum: [true] }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/cases/{caseId}/documents:
    servers:
      - url: '{cfBaseUrl}'
        variables:
          cfBaseUrl:
            default: https://api.example.invalid
    post:
      tags: [ConcordatoFacile]
      operationId: uploadDocument
      summary: Uploads a document (for example the signed contract)
      security: [{ BearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, sha256, file]
              properties:
                kind: { type: string, enum: [signed_contract, requested_document, other] }
                requestId: { type: string, description: Se il documento risponde a una richiesta }
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                file: { type: string, format: binary, description: PDF fino a 20 MB }
      responses:
        '201':
          description: Document received
          content:
            application/json:
              schema:
                type: object
                required: [fileId]
                properties:
                  fileId: { type: string }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '413': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Chiave API di ConcordatoFacile (una per prova e una per produzione)

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID. Una ripetizione con la stessa chiave restituisce la stessa risposta.
      schema: { type: string, format: uuid }

  responses:
    InvalidSignature:
      description: Firma o orario non validi. Non ritentare.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            signature: { value: { code: invalid_signature } }
            timestamp: { value: { code: timestamp_out_of_range } }
    UnknownReference:
      description: reference sconosciuto. Non ritentare.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unknown: { value: { code: unknown_reference } }
    NotRetryable:
      description: Richiesta non valida. Non ritentare.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Retryable:
      description: Problema temporaneo. Ritentare con backoff.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ApiError:
      description: Errore dell'API
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validazione fallita
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            fields:
              value:
                code: validation_failed
                message: The request is not valid.
                errors:
                  - { field: 'parties[0].taxCode', code: invalid_format }
                  - { field: 'property.cadastre.parcel', code: required }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 'validation_failed, unauthorized, case_not_found, invalid_state, file_too_large, checksum_mismatch, duplicate_request'
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string, enum: [required, invalid_format, out_of_range, unknown_value] }

    Level:
      type: string
      enum: [basic, complete]

    Status:
      type: string
      enum: [received, in_review, information_requested, certified, draft_ready, awaiting_signature, in_registration, completed, rejected, cancelled]

    EventEnvelope:
      type: object
      required: [eventId, eventType, apiVersion, occurredAt, sequence, caseId, reference, data]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        apiVersion: { type: string, enum: ['1'] }
        occurredAt: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1, description: 'Cresce di 1 per ogni pratica, da 1' }
        caseId: { type: string }
        reference: { type: string, format: uuid, description: 'UUID creato da CasaZen, restituito sempre' }
        data: { type: object }

    Event:
      oneOf:
        - { $ref: '#/components/schemas/CaseCreatedEvent' }
        - { $ref: '#/components/schemas/CaseStatusChangedEvent' }
        - { $ref: '#/components/schemas/CaseInformationRequestedEvent' }
        - { $ref: '#/components/schemas/CaseDraftReadyEvent' }
        - { $ref: '#/components/schemas/CaseCompletedEvent' }
        - { $ref: '#/components/schemas/CaseRejectedEvent' }
        - { $ref: '#/components/schemas/CaseCancelledEvent' }
      discriminator:
        propertyName: eventType
        mapping:
          case.created: '#/components/schemas/CaseCreatedEvent'
          case.status_changed: '#/components/schemas/CaseStatusChangedEvent'
          case.information_requested: '#/components/schemas/CaseInformationRequestedEvent'
          case.draft_ready: '#/components/schemas/CaseDraftReadyEvent'
          case.completed: '#/components/schemas/CaseCompletedEvent'
          case.rejected: '#/components/schemas/CaseRejectedEvent'
          case.cancelled: '#/components/schemas/CaseCancelledEvent'

    CaseCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.created] }
            data:
              type: object
              required: [level, istatCode]
              properties:
                level: { $ref: '#/components/schemas/Level' }
                istatCode: { type: string, pattern: '^[0-9]{6}$' }

    CaseStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.status_changed] }
            data:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [in_review, certified, awaiting_signature, in_registration] }

    CaseInformationRequestedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.information_requested] }
            data:
              type: object
              required: [requestId, questions]
              properties:
                requestId: { type: string }
                dueAt: { type: string, format: date-time }
                questions:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Question' }

    CaseDraftReadyEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.draft_ready] }
            data:
              type: object
              required: [draftId, version, files, allowedActions]
              properties:
                draftId: { type: string }
                version: { type: integer, minimum: 1 }
                files:
                  type: array
                  items: { $ref: '#/components/schemas/File' }
                allowedActions:
                  type: array
                  items: { type: string, enum: [approve, request_changes] }
                notes: { type: string, maxLength: 2000 }
                dueAt: { type: string, format: date-time }

    CaseCompletedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.completed] }
            data:
              type: object
              required: [attestation, files]
              properties:
                attestation: { $ref: '#/components/schemas/Attestation' }
                registration: { $ref: '#/components/schemas/Registration' }
                files:
                  type: array
                  items: { $ref: '#/components/schemas/File' }

    CaseRejectedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.rejected] }
            data:
              type: object
              required: [reason, detail]
              properties:
                reason: { type: string, enum: [rent_out_of_range, inconsistent_data, agreement_not_in_force, municipality_not_covered, invalid_documents, other] }
                detail: { type: string, maxLength: 1000 }
                limits:
                  type: object
                  properties:
                    minMonthlyRentCents: { type: integer, minimum: 0 }
                    maxMonthlyRentCents: { type: integer, minimum: 0 }

    CaseCancelledEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType: { type: string, enum: [case.cancelled] }
            data:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }

    Question:
      type: object
      required: [field, label, type, required]
      properties:
        field: { type: string, description: 'Percorso con punti, es. property.cadastre.subparcel; per i documenti documents.<kind>' }
        label: { type: string }
        type: { type: string, enum: [text, number, date, choice, file] }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        help: { type: string }

    InformationAnswers:
      type: object
      required: [type, requestId, answers]
      properties:
        type: { type: string, enum: [information] }
        requestId: { type: string }
        answers:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field: { type: string }
              value: { type: string, description: 'Sempre una stringa; date YYYY-MM-DD; numeri con il punto' }
              fileId: { type: string, description: 'Per il tipo file: id restituito dal caricamento' }

    DraftDecision:
      type: object
      required: [type, draftId, decision]
      properties:
        type: { type: string, enum: [draft_decision] }
        draftId: { type: string }
        decision: { type: string, enum: [approved, changes_requested] }
        notes: { type: string, maxLength: 2000 }

    File:
      type: object
      required: [fileId, kind, fileName, mimeType, sizeBytes, sha256, downloadUrl, expiresAt]
      properties:
        fileId: { type: string }
        kind:
          type: string
          enum: [attestation, calculation_sheet, contract_draft, signed_contract, submission_receipt, registration_receipt, payment_receipt, full_package_zip, other, request_form, lease_contract, cadastral_survey, floor_plan, energy_certificate]
        fileName: { type: string, maxLength: 150 }
        mimeType: { type: string, enum: [application/pdf, application/zip] }
        sizeBytes: { type: integer, minimum: 1, description: 'Massimo 20 MB per un PDF; 40 MB per uno zip compresso' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        downloadUrl: { type: string, format: uri, description: 'HTTPS, valido almeno 7 giorni' }
        expiresAt: { type: string, format: date-time }

    Attestation:
      type: object
      required: [attestationId, issuedOn, agreement, organizations, rent, documentFileId]
      properties:
        attestationId: { type: string }
        issuedOn: { type: string, format: date }
        agreement:
          type: object
          required: [name, istatCode, inForceFrom]
          properties:
            name: { type: string }
            istatCode: { type: string, pattern: '^[0-9]{6}$' }
            inForceFrom: { type: string, format: date }
        organizations:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, represents, signerName, signedOn]
            properties:
              name: { type: string }
              represents: { type: string, enum: [landlords, tenants] }
              signerName: { type: string }
              signedOn: { type: string, format: date }
        rent:
          type: object
          required: [zone, subBand, areaSqm, minMonthlyRentCents, maxMonthlyRentCents, agreedMonthlyRentCents]
          properties:
            zone: { type: string }
            subBand: { type: integer, minimum: 1, maximum: 3 }
            areaSqm: { type: number, multipleOf: 0.1 }
            minMonthlyRentCents: { type: integer, minimum: 0 }
            maxMonthlyRentCents: { type: integer, minimum: 0 }
            agreedMonthlyRentCents: { type: integer, minimum: 0 }
        documentFileId: { type: string }

    Registration:
      type: object
      required: [type, revenueOffice, registeredOn, electronicProtocol, contractIdentificationCode, flatTaxElected, registrationTaxCents, stampDutyCents, receiptFileIds]
      properties:
        type: { type: string, enum: [L1, L2] }
        revenueOffice: { type: string }
        registeredOn: { type: string, format: date }
        electronicProtocol: { type: string }
        contractIdentificationCode: { type: string }
        flatTaxElected: { type: boolean }
        registrationTaxCents: { type: integer, minimum: 0 }
        stampDutyCents: { type: integer, minimum: 0 }
        receiptFileIds:
          type: array
          items: { type: string }

    CreateCaseRequest:
      type: object
      required: [reference, level, property, parties, contract]
      properties:
        reference: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/Level' }
        property:
          type: object
          required: [istatCode, address, cadastre]
          properties:
            istatCode: { type: string, pattern: '^[0-9]{6}$' }
            address: { type: string }
            postalCode: { type: string }
            cadastre:
              type: object
              required: [sheet, parcel]
              properties:
                sheet: { type: string }
                parcel: { type: string }
                subparcel: { type: string }
                category: { type: string }
            areaSqm: { type: number, multipleOf: 0.1 }
        parties:
          type: array
          minItems: 2
          items:
            type: object
            required: [role, firstName, lastName, taxCode]
            properties:
              role: { type: string, enum: [landlord, tenant] }
              firstName: { type: string }
              lastName: { type: string }
              taxCode: { type: string }
              ownershipPercent: { type: number, minimum: 0, maximum: 100 }
        contract:
          type: object
          required: [startDate, termYears, monthlyRentCents]
          properties:
            startDate: { type: string, format: date }
            termYears: { type: integer, minimum: 3 }
            monthlyRentCents: { type: integer, minimum: 0 }
            furnished: { type: boolean }
            airConditioning: { type: boolean }
            elements:
              type: object
              description: 'Codici A-D dell''accordo dichiarati dalle parti'
              properties:
                A: { type: array, items: { type: string } }
                B: { type: array, items: { type: string } }
                C: { type: array, items: { type: string } }
                D: { type: array, items: { type: string } }
        casazenCalculation:
          type: object
          description: Calcolo di CasaZen, per il confronto con la verifica di ConcordatoFacile
          properties:
            zone: { type: string }
            subBand: { type: integer, minimum: 1, maximum: 3 }
            minMonthlyRentCents: { type: integer, minimum: 0 }
            maxMonthlyRentCents: { type: integer, minimum: 0 }
        documents:
          type: array
          items: { $ref: '#/components/schemas/File' }

    CaseCreated:
      type: object
      required: [caseId, reference, status]
      properties:
        caseId: { type: string }
        reference: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        formUrl:
          type: string
          format: uri
          description: Link per completare nel modulo i dati ancora mancanti
